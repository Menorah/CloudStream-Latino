name: Pruebas WebView en Android
on:
  workflow_dispatch:
    inputs:
      live:
        description: "Probar también el sitio real (puede fallar por causas externas)"
        type: boolean
        default: false
      hosts:
        description: "Diagnosticar reproductores reales (puede fallar por causas externas)"
        type: boolean
        default: false
  push:
    branches: ['arena/**']
    paths:
      - 'AnimeOnlineNinja/**'
      - 'VerAni/**'
      - '.github/workflows/android-browser-test.yml'
permissions:
  contents: read
jobs:
  webview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ejecutar pruebas con WebView real
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: RUN_LIVE_SITE=${{ inputs.live && '1' || '0' }} RUN_HOST_DIAGNOSTICS=${{ inputs.hosts && '1' || '0' }} ./scripts/run_android_tests.sh
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-webview
          path: |
            AnimeOnlineNinja/build/reports/androidTests/
            VerAni/build/reports/androidTests/
          if-no-files-found: ignore
