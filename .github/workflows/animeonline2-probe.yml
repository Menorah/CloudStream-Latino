name: Probe AnimeOnline2
on:
  push:
    branches: ['arena/**']
    paths: ['scripts/animeonline2_probe.py', '.github/workflows/animeonline2-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python3 scripts/animeonline2_probe.py
