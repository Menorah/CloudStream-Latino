name: Publicación beta (prueba en la red del usuario)
# Publica los complementos en una release "beta" aparte para que el usuario pueda
# agregar https://github.com/Menorah/CloudStream-Latino/releases/download/beta/repo.json
# como repositorio en CloudStream. No toca la release oficial "cloudstream".
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/beta-publish.yml', 'beta-trigger']
permissions:
  contents: write
concurrency:
  group: beta-publish
  cancel-in-progress: false
jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar y probar los quince complementos
        shell: bash
        env:
          GNULAHD_LIVE: 'true'
          PELIS182_LIVE: 'true'
        run: |
          set +e
          ./gradlew \
            :AnimeOnlineNinja:testDebugUnitTest :VerAni:testDebugUnitTest :Latanime:testDebugUnitTest :Repelis24CZ:testDebugUnitTest \
            :CinecalidadAM:testDebugUnitTest :CinecalidadMY:testDebugUnitTest :RePelisHD:testDebugUnitTest \
            :PoseidonHD2:testDebugUnitTest :RePelis24Shop:testDebugUnitTest :PeliCineHD:testDebugUnitTest \
            :CinecalidadOrg:testDebugUnitTest :Cuevana3v:testDebugUnitTest :PelisJuanita:testDebugUnitTest \
            :GnulaHD:testDebugUnitTest :Pelis182:testDebugUnitTest make makePluginsJson --stacktrace > build-log.txt 2>&1
          status=$?
          tail -60 build-log.txt
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for report in pathlib.Path('.').glob('*/build/test-results/testDebugUnitTest/TEST-*.xml'):
              try:
                  for case in ET.parse(report).findall('.//testcase'):
                      for failure in case.findall('failure') + case.findall('error'):
                          text = case.get('classname', '') + '.' + case.get('name', '') + ': ' + (failure.get('message') or failure.text or '')[:1500]
                          print('::error::' + text.replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D'))
              except ET.ParseError:
                  pass
          log = pathlib.Path('build-log.txt').read_text(errors='replace')
          relevant = [s for s in log.splitlines() if s.startswith('e: ') or 'FAILED' in s or 'What went wrong:' in s or s.startswith('> ')]
          if relevant:
              print('::error::' + ' | '.join(relevant[:12]).replace('%', '%25'))
          PY
          fi
          exit "$status"
      - name: Preparar archivos beta
        shell: bash
        run: |
          mkdir -p output
          cp AnimeOnlineNinja/build/AnimeOnlineNinja.cs3 output/
          cp VerAni/build/VerAni.cs3 output/
          cp Latanime/build/Latanime.cs3 output/
          cp Repelis24CZ/build/Repelis24CZ.cs3 output/
          cp CinecalidadAM/build/CinecalidadAM.cs3 output/
          cp CinecalidadMY/build/CinecalidadMY.cs3 output/
          cp RePelisHD/build/RePelisHD.cs3 output/
          cp PoseidonHD2/build/PoseidonHD2.cs3 output/
          cp RePelis24Shop/build/RePelis24Shop.cs3 output/
          cp PeliCineHD/build/PeliCineHD.cs3 output/
          cp CinecalidadOrg/build/CinecalidadOrg.cs3 output/
          cp Cuevana3v/build/Cuevana3v.cs3 output/
          cp PelisJuanita/build/PelisJuanita.cs3 output/
          cp GnulaHD/build/GnulaHD.cs3 output/
          cp Pelis182/build/Pelis182.cs3 output/
          cp assets/repo-icon.png output/repo-icon.png
          python3 - <<'PY'
          import json, pathlib
          plugins = json.loads(pathlib.Path('build/plugins.json').read_text())
          for plugin in plugins:
              plugin['url'] = plugin['url'].replace('/releases/download/cloudstream/', '/releases/download/beta/')
          pathlib.Path('output/plugins.json').write_text(json.dumps(plugins, ensure_ascii=False))
          repo = json.loads(pathlib.Path('repo.json').read_text())
          repo['name'] = 'CloudStream Latino (beta)'
          repo['iconUrl'] = 'https://github.com/Menorah/CloudStream-Latino/releases/download/beta/repo-icon.png'
          repo['description'] = 'Canal beta de las extensiones CloudStream Latino'
          repo['pluginLists'] = ['https://github.com/Menorah/CloudStream-Latino/releases/download/beta/plugins.json']
          pathlib.Path('output/repo.json').write_text(json.dumps(repo, ensure_ascii=False))
          names = {pathlib.Path(p['url']).name for p in plugins}
          expected = {
              'AnimeOnlineNinja.cs3', 'VerAni.cs3', 'Latanime.cs3', 'Repelis24CZ.cs3', 'CinecalidadAM.cs3',
              'CinecalidadMY.cs3', 'RePelisHD.cs3', 'PoseidonHD2.cs3', 'RePelis24Shop.cs3',
              'PeliCineHD.cs3', 'CinecalidadOrg.cs3', 'Cuevana3v.cs3', 'PelisJuanita.cs3', 'GnulaHD.cs3', 'Pelis182.cs3',
          }
          assert names == expected, (sorted(names), sorted(expected))
          for name in expected:
              assert (pathlib.Path('output') / name).stat().st_size > 0
          assert (pathlib.Path('output') / 'repo-icon.png').stat().st_size > 0
          for p in plugins:
              assert p.get('language') == 'es-419', p
              icon = p.get('iconUrl') or ''
              assert icon.startswith('https://') and not icon.lower().endswith('.svg'), p
              prefix = 'https://raw.githubusercontent.com/Menorah/CloudStream-Latino/main/'
              if icon.startswith(prefix):
                  asset = pathlib.Path(icon[len(prefix):])
                  assert asset.is_file() and asset.read_bytes().startswith(b'\x89PNG\r\n\x1a\n'), (p, asset)
          print('beta:', sorted(names))
          PY
      - name: Publicar en la release beta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create beta --title "Extensiones CloudStream beta" --notes "Canal beta de las extensiones CloudStream Latino." --prerelease || true
          gh release upload beta output/* --clobber
          for old in VerAniV2.cs3 Repelis24CZBis.cs3 RePelis24ShopBis.cs3 RePelisHDBis.cs3 CinecalidadAMBis.cs3 CinecalidadMYBis.cs3; do
            gh release delete-asset beta "$old" -y || true
          done
          gh release view beta --json assets --jq '.assets[].name'
