name: Compilar extensión
on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar y generar índice
        shell: bash
        run: |
          set +e
          ./gradlew :AnimeOnlineNinja:testDebugUnitTest :VerAni:testDebugUnitTest :Latanime:testDebugUnitTest :Repelis24CZ:testDebugUnitTest :RePelis24Shop:testDebugUnitTest :CinecalidadAM:testDebugUnitTest :CinecalidadMY:testDebugUnitTest :RePelisHD:testDebugUnitTest :PoseidonHD2:testDebugUnitTest :PeliCineHD:testDebugUnitTest :CinecalidadOrg:testDebugUnitTest :Cuevana3v:testDebugUnitTest :PelisJuanita:testDebugUnitTest make makePluginsJson --stacktrace > build-log.txt 2>&1
          status=$?
          cat build-log.txt
          if [ "$status" -ne 0 ]; then
            python3 - <<'PYLOG'
          import pathlib, xml.etree.ElementTree as ET
          for report in pathlib.Path('.').glob('*/build/test-results/testDebugUnitTest/TEST-*.xml'):
              try:
                  for case in ET.parse(report).findall('.//testcase'):
                      for failure in case.findall('failure') + case.findall('error'):
                          text = case.get('classname', '') + '.' + case.get('name', '') + ': ' + (failure.get('message') or failure.text or '')[:1500]
                          print('::error::' + text.replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D'))
              except ET.ParseError:
                  pass
          lines = pathlib.Path('build-log.txt').read_text(errors='replace').splitlines()
          relevant = [s for s in lines if s.startswith('e: ') or (s.startswith('> ') and not s.startswith('> Task ')) or 'What went wrong:' in s or 'Could not ' in s or 'Failed to ' in s]
          print('::error::' + (' | '.join(relevant[:12]) or 'Ver registro de compilación').replace('%', '%25'))
          PYLOG
          fi
          exit "$status"
      - name: Preparar archivos
        run: |
          mkdir -p output
          cp AnimeOnlineNinja/build/AnimeOnlineNinja.cs3 output/
          cp VerAni/build/VerAni.cs3 output/
          cp Latanime/build/Latanime.cs3 output/
          cp Repelis24CZ/build/Repelis24CZ.cs3 output/
          cp CinecalidadAM/build/CinecalidadAM.cs3 output/
          cp CinecalidadMY/build/CinecalidadMY.cs3 output/
          cp RePelisHD/build/RePelisHD.cs3 output/
          cp PoseidonHD2/build/PoseidonHD2.cs3 output/
          cp RePelis24Shop/build/RePelis24Shop.cs3 output/
          cp PeliCineHD/build/PeliCineHD.cs3 output/
          cp CinecalidadOrg/build/CinecalidadOrg.cs3 output/
          cp Cuevana3v/build/Cuevana3v.cs3 output/
          cp PelisJuanita/build/PelisJuanita.cs3 output/
          cp build/plugins.json output/
          cp repo.json output/
          cp assets/repo-icon.png output/repo-icon.png
          python3 - <<'PY'
          import json, pathlib
          output = pathlib.Path('output')
          plugins = json.loads((output / 'plugins.json').read_text())
          names = {pathlib.Path(p['url']).name for p in plugins}
          expected = {
              'AnimeOnlineNinja.cs3', 'VerAni.cs3', 'Latanime.cs3', 'Repelis24CZ.cs3', 'CinecalidadAM.cs3',
              'CinecalidadMY.cs3', 'RePelisHD.cs3', 'PoseidonHD2.cs3', 'RePelis24Shop.cs3',
              'PeliCineHD.cs3', 'CinecalidadOrg.cs3', 'Cuevana3v.cs3', 'PelisJuanita.cs3',
          }
          assert names == expected, (sorted(names), sorted(expected))
          for name in expected:
              assert (output / name).stat().st_size > 0
          assert (output / 'repo-icon.png').stat().st_size > 0
          for p in plugins:
              assert p.get('language') == 'es-419', p
              icon = p.get('iconUrl') or ''
              assert icon.startswith('https://') and not icon.lower().endswith('.svg'), p
          repo = json.loads((output / 'repo.json').read_text())
          assert repo.get('iconUrl', '').endswith('/releases/download/cloudstream/repo-icon.png'), repo
          print('cloudstream:', sorted(names))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeOnlineNinja
          path: output/
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AnimeOnlineNinja
          path: output
      - name: Publicar archivos para CloudStream
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cloudstream
          target_commitish: ${{ github.sha }}
          name: Extensiones CloudStream
          files: output/*
          fail_on_unmatched_files: true
      - name: Eliminar activos obsoletos de la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for old in VerAniV2.cs3 Repelis24CZBis.cs3 RePelis24ShopBis.cs3 RePelisHDBis.cs3 CinecalidadAMBis.cs3 CinecalidadMYBis.cs3; do
            gh release delete-asset cloudstream "$old" --repo "${{ github.repository }}" -y || true
          done
          gh release view cloudstream --repo "${{ github.repository }}" --json assets --jq '.assets[].name'
