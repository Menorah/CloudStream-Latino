name: Diagnóstico de catálogos adicionales
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['scripts/catalogue_sites_probe.py', 'scripts/poseidon_probe.py', 'scripts/poseidon_js_probe.py', '.github/workflows/catalogue-diagnostics.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/catalogue_sites_probe.py
      - run: python3 scripts/poseidon_probe.py
      - run: python3 scripts/poseidon_js_probe.py
