name: Diagnóstico Cinecalidad AM
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['scripts/cinecalidad_am_probe.py', '.github/workflows/cinecalidad-am-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/cinecalidad_am_probe.py
