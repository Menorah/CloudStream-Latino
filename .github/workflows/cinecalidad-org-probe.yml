name: Probe CinecalidadOrg
on:
  push:
    branches: ['arena/**']
    paths: ['scripts/cinecalidad_org_probe.py', '.github/workflows/cinecalidad-org-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q beautifulsoup4 requests
      - run: python3 scripts/cinecalidad_org_probe.py
