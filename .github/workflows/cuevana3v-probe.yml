name: Diagnóstico Cuevana3v.pro
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['scripts/cuevana3v_probe.py', '.github/workflows/cuevana3v-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/cuevana3v_probe.py
