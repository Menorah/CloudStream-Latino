name: Diagnóstico de reproductores
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - scripts/host_probe.py
      - .github/workflows/host-diagnostics.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar metadatos públicos sin guardar enlaces de vídeo
        run: python3 scripts/host_probe.py
