name: Diagnóstico de extracción de hosts
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['scripts/host_unpack_probe.py', '.github/workflows/host-unpack-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4 jsbeautifier
      - run: python3 scripts/host_unpack_probe.py
