name: Sonda de HTML (fijar selectores)

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths:
      - "scripts/html_probe/**"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Volar HTML real de los tres sitios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/html_probe/probe.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-raw
          path: out/
