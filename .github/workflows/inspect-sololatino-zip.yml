name: Inspect SoloLatino ZIP

on:
  push:
    branches:
      - arena/**

jobs:
  zip_extra_details:
    runs-on: ubuntu-latest
    steps:
      - name: Download ZIP
        run: |
          curl -L -A "Mozilla/5.0" -o /tmp/site.zip "https://tmpfiles.org/dl/wLAXvg4SCnBj/sololatino.net.zip" || \
          curl -L -A "Mozilla/5.0" -o /tmp/site.zip "https://tmpfiles.org/wLAXvg4SCnBj/sololatino.net.zip"
          unzip -q /tmp/site.zip -d /tmp/site_extract

      - name: Emit PSH tail & embed69 full JSON & casey scripts & all HTML inventory
        run: |
          python3 - <<'PY'
          import os, re, json

          root = '/tmp/site_extract'
          htmls = []
          for r, _, fs in os.walk(root):
              for f in fs:
                  if f.lower().endswith(('.html', '.htm')):
                      p = os.path.join(r, f)
                      htmls.append((os.path.getsize(p), os.path.relpath(p, root), p))
          htmls.sort()

          def emit(tag, text):
              if not text: return
              chunk = 3400
              parts = [text[i:i+chunk] for i in range(0, len(text), chunk)]
              for idx, part in enumerate(parts, 1):
                  safe = part.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f"::notice title={tag}#{idx}/{len(parts)}::{safe}")

          inv = [f"{sz:>8} {rel}" for sz, rel, _ in htmls]
          emit("HTML_INV", "\n".join(inv))

          # 1. PSH end of script (after _noClickTries)
          psh_path = next((p for _, rel, p in htmls if 'tt1190634-5x08' in rel and 'pelisserieshoy' in rel), None)
          if psh_path:
              s = open(psh_path, errors='ignore').read()
              idx = s.find('_noClickTries')
              if idx >= 0:
                  emit("PSH_END", s[idx:idx+6800])

          # 2. Casey scripts (non-jwplayer/svg)
          casey_path = next((p for _, rel, p in htmls if '84emedzn9bzh' in rel), None)
          if casey_path:
              s = open(casey_path, errors='ignore').read()
              scripts = re.findall(r'<script[^>]*>.*?</script>', s, re.S | re.I)
              kept = [sc for sc in scripts if len(sc) < 20000 and ('application/json' in sc.lower() or 'source' in sc.lower() or 'voe' in sc.lower() or 'decrypt' in sc.lower() or len(sc) > 50)]
              emit("CASEY_SCRIPTS", "\n---\n".join(kept)[:6800])

          # 3. Embed69 dataLink & challenge
          e69_path = next((p for _, rel, p in htmls if 'tt45368240' in rel and 'embed69' in rel), None)
          if e69_path:
              s = open(e69_path, errors='ignore').read()
              m_dl = re.search(r'dataLink\s*=\s*(\[.*?\]);', s, re.S)
              m_ch = re.search(r'LINK_CHALLENGE\s*=\s*[\'"]([^\'"]+)', s)
              m_sa = re.search(r'LINK_SALT\s*=\s*[\'"]([^\'"]+)', s)
              emit("E69_DATA", f"ch={m_ch and m_ch.group(1)}\nsalt={m_sa and m_sa.group(1)}\ndl={(m_dl and m_dl.group(1))[:3000]}")
          PY

  casey_and_voe_live:
    runs-on: ubuntu-latest
    steps:
      - name: Install curl_cffi
        run: python3 -m pip install -q curl_cffi

      - name: Dump live caseyseemavoid HTML and test mirrors
        run: |
          python3 - <<'PY'
          from curl_cffi import requests as creq
          s = creq.Session(impersonate="chrome131")
          r = s.get("https://caseyseemavoid.com/e/84emedzn9bzh", headers={"Referer": "https://embed69.org/"}, timeout=15)
          msg = f"status={r.status_code} headers={dict(r.headers)}\ncookies={dict(s.cookies)}\nbody=\n{r.text}"
          for idx in range(0, len(msg), 3400):
              safe = msg[idx:idx+3400].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f"::notice title=CASEY_LIVE#{idx//3400 + 1}::{safe}")
          PY
