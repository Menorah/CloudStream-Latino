name: Inspect SoloLatino ZIP Part 3
on:
  push:
    branches:
      - 'arena/**'
permissions:
  contents: read
jobs:
  zip_part3:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [psh_player, e69_player_js, home_and_theboys]
    steps:
      - name: Emit ${{ matrix.part }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re, urllib.request, zipfile

          PART = os.environ['PART']
          DEST = pathlib.Path('/tmp/zip_inspect')
          DEST.mkdir(parents=True, exist_ok=True)
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/131.0.0.0 Safari/537.36', 'Accept': '*/*'}
          zip_path = pathlib.Path('/tmp/sololatino.net.zip')
          def fetch_bytes(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers=headers), timeout=60) as resp:
                  return resp.read()
          for cand in ['https://tmpfiles.org/dl/wLAXvg4SCnBj/sololatino.net.zip', 'https://tmpfiles.org/wLAXvg4SCnBj/sololatino.net.zip']:
              try:
                  data = fetch_bytes(cand)
                  if data[:4] in (b'PK\x03\x04', b'PK\x05\x06', b'PK\x07\x08'):
                      zip_path.write_bytes(data); break
                  text = data.decode('utf-8', 'replace')
                  m = re.search(r'https?://tmpfiles\.org/dl/[^"\'\s<>]+', text) or re.search(r'href=["\'](/dl/[^"\']+)["\']', text)
                  if m:
                      dl2 = m.group(0) if m.group(0).startswith('http') else 'https://tmpfiles.org' + m.group(1)
                      data2 = fetch_bytes(dl2)
                      if data2[:4] in (b'PK\x03\x04', b'PK\x05\x06', b'PK\x07\x08'):
                          zip_path.write_bytes(data2); break
              except Exception:
                  pass
          with zipfile.ZipFile(zip_path) as zf:
              zf.extractall(DEST)
          all_files = sorted(p for p in DEST.rglob('*') if p.is_file())
          out = []

          if PART == 'psh_player':
              p = next(x for x in all_files if x.name == 'tt1190634-5x08.html')
              txt = p.read_text('utf-8', 'replace')
              out.append(f'=== PSH_PLAYER {p.relative_to(DEST)} len={len(txt)} ===')
              out.append(txt[:33000])

          elif PART == 'e69_player_js':
              p = next(x for x in all_files if x.name == 'tt45368240.html')
              txt = p.read_text('utf-8', 'replace')
              out.append(f'=== E69_FULL len={len(txt)} ===')
              for idx, (attrs, body) in enumerate(re.findall(r'<script\b([^>]*)>([\s\S]*?)</script>', txt, re.I)):
                  if idx == 3:
                      out.append(f'sc[3] len={len(body)}:\n' + body)
              # Also show body HTML (excluding style/script)
              cleaned = re.sub(r'<(script|style)\b[\s\S]*?</\1>', '', txt, flags=re.I)
              out.append('=== E69 BODY_HTML ===\n' + re.sub(r'\s+', ' ', cleaned)[:8000])

          elif PART == 'home_and_theboys':
              tb = next(x for x in all_files if 'Ver The Boys' in x.name and x.suffix == '.html').read_text('utf-8', 'replace')
              out.append('=== THE_BOYS_SEASON_5 ===')
              m = re.search(r'data-season-panel=["\']5["\'][\s\S]{0,12000}', tb)
              if m:
                  out.append(m.group(0)[:10000])
              home = next(x for x in all_files if 'Ver películas y series' in x.name and x.suffix == '.html').read_text('utf-8', 'replace')
              out.append('=== HOME SECTIONS ===')
              secs = re.findall(r'<h2[^>]*>[\s\S]{0,120}', home)
              out.append('H2: ' + str([re.sub(r'\s+', ' ', s) for s in secs]))
              m_ep = re.search(r'id=["\']scroll-episodios["\'][\s\S]{0,6000}', home)
              if m_ep:
                  out.append('EP_CAROUSEL: ' + m_ep.group(0)[:5500])
              m_grid = re.search(r'id=["\']ep-grid-wrapper["\'][\s\S]{0,4000}', home)
              if m_grid:
                  out.append('EP_GRID: ' + m_grid.group(0)[:3500])
              m_cards = re.findall(r'<div[^>]*class=["\']card["\'][\s\S]{0,900}', home)
              out.append('FIRST_3_CARDS:\n' + '\n---\n'.join(m_cards[:3]))

          full = '\n'.join(out)
          chunks = [full[i:i+3500] for i in range(0, len(full), 3500)]
          for idx, ch in enumerate(chunks[:10]):
              safe = ch.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::notice title={PART}_{idx:02d}of{len(chunks):02d}::{safe}')
          PY
        env:
          PART: ${{ matrix.part }}
