name: Inspect SoloLatino ZIP
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/inspect-sololatino-zip.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dump_app_js_and_saved_res:
    runs-on: ubuntu-latest
    steps:
      - name: Download ZIP and dump app-Ce29xM4N.js (full site JS part) + saved_resource (13556 B)
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, urllib.request, zipfile

          def emit(tag, text, max_ann=10, chunk=5500):
              parts = [text[i:i+chunk] for i in range(0, len(text), chunk)] or [""]
              for idx, p in enumerate(parts[:max_ann], 1):
                  safe = p.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f"::notice::[{tag}#{idx}/{min(len(parts), max_ann)}/{len(parts)}] {safe}")

          req = urllib.request.Request("https://tmpfiles.org/wLAXvg4SCnBj/sololatino.net.zip", headers={"User-Agent": "Mozilla/5.0 Chrome/131.0.0.0"})
          page = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "replace")
          m = re.search(r'https?://tmpfiles\.org/dl/[^"\'\s<>]+', page)
          dl_url = m.group(0) if m else "https://tmpfiles.org/dl/1795841645.e782f0f73a74db6e/wLAXvg4SCnBj/sololatino.net.zip"
          dl_req = urllib.request.Request(dl_url, headers={"User-Agent": "Mozilla/5.0 Chrome/131.0.0.0", "Referer": "https://tmpfiles.org/wLAXvg4SCnBj/sololatino.net.zip"})
          with urllib.request.urlopen(dl_req, timeout=180) as r, open("/tmp/sl.zip", "wb") as f:
              while True:
                  buf = r.read(65536)
                  if not buf:
                      break
                  f.write(buf)
          with zipfile.ZipFile("/tmp/sl.zip") as zf:
              zf.extractall("/tmp/sl_zip")

          root = pathlib.Path("/tmp/sl_zip")
          app_js = next(root.rglob("*app-Ce29xM4N.js*")).read_text(errors="replace")
          # Skip vendor Axios prefix (~30KB), dump the entire site logic around _slH/_slP/gr/re/N
          idx = app_js.find("HttpStatusCode")
          site_part = app_js[idx:] if idx > 0 else app_js[30000:]
          emit("APP_JS_SITE", site_part, max_ann=10)

          sr = root / "sololatino.net/peliculas/ejemplo pelicula/Ver Puedes verlo todo (2026) Online Latino HD — SoloLatino.Net_files/saved_resource.html"
          emit("SAVED_RES_E69", sr.read_text(errors="replace"), max_ann=4)
          PY

      - name: Dump tt45368240.html scripts and full body (excluding darkreader CSS)
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re

          def emit(tag, text, max_ann=10, chunk=5500):
              parts = [text[i:i+chunk] for i in range(0, len(text), chunk)] or [""]
              for idx, p in enumerate(parts[:max_ann], 1):
                  safe = p.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f"::notice::[{tag}#{idx}/{min(len(parts), max_ann)}/{len(parts)}] {safe}")

          root = pathlib.Path("/tmp/sl_zip")
          p = next(root.rglob("*tt45368240.html"))
          txt = p.read_text(errors="replace")
          clean = re.sub(r'<style[^>]*class="darkreader[^"]*"[^>]*>[\s\S]*?</style>', '', txt)
          emit("TT45368240", clean, max_ann=10)
          PY

      - name: Dump base.js and base-legacy.js
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib

          def emit(tag, text, max_ann=10, chunk=5500):
              parts = [text[i:i+chunk] for i in range(0, len(text), chunk)] or [""]
              for idx, p in enumerate(parts[:max_ann], 1):
                  safe = p.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f"::notice::[{tag}#{idx}/{min(len(parts), max_ann)}/{len(parts)}] {safe}")

          root = pathlib.Path("/tmp/sl_zip")
          out = []
          for pat in ("*base.DLdCRf7_*.js*", "*base-legacy*.js*"):
              for p in root.rglob(pat):
                  out.append(f"=== {p.name} ===\n" + p.read_text(errors="replace"))
          emit("BASE_JS", "\n\n".join(out), max_ann=4)
          PY

  dump_psh_and_live_check:
    runs-on: ubuntu-latest
    steps:
      - name: Download ZIP and dump tt1190634-5x08.html (PelisSeriesHoy full)
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, urllib.request, zipfile

          def emit(tag, text, max_ann=10, chunk=5500):
              parts = [text[i:i+chunk] for i in range(0, len(text), chunk)] or [""]
              for idx, p in enumerate(parts[:max_ann], 1):
                  safe = p.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f"::notice::[{tag}#{idx}/{min(len(parts), max_ann)}/{len(parts)}] {safe}")

          req = urllib.request.Request("https://tmpfiles.org/wLAXvg4SCnBj/sololatino.net.zip", headers={"User-Agent": "Mozilla/5.0 Chrome/131.0.0.0"})
          page = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "replace")
          m = re.search(r'https?://tmpfiles\.org/dl/[^"\'\s<>]+', page)
          dl_url = m.group(0) if m else "https://tmpfiles.org/dl/1795841645.e782f0f73a74db6e/wLAXvg4SCnBj/sololatino.net.zip"
          dl_req = urllib.request.Request(dl_url, headers={"User-Agent": "Mozilla/5.0 Chrome/131.0.0.0", "Referer": "https://tmpfiles.org/wLAXvg4SCnBj/sololatino.net.zip"})
          with urllib.request.urlopen(dl_req, timeout=180) as r, open("/tmp/sl.zip", "wb") as f:
              while True:
                  buf = r.read(65536)
                  if not buf:
                      break
                  f.write(buf)
          with zipfile.ZipFile("/tmp/sl.zip") as zf:
              zf.extractall("/tmp/sl_zip")

          root = pathlib.Path("/tmp/sl_zip")
          p = next(root.rglob("*tt1190634-5x08.html"))
          txt = p.read_text(errors="replace")
          clean = re.sub(r'<style[^>]*class="darkreader[^"]*"[^>]*>[\s\S]*?</style>', '', txt)
          emit("PSH_PART1", clean[:55000], max_ann=10)
          PY

      - name: Dump tt1190634-5x08.html part 2
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re

          def emit(tag, text, max_ann=10, chunk=5500):
              parts = [text[i:i+chunk] for i in range(0, len(text), chunk)] or [""]
              for idx, p in enumerate(parts[:max_ann], 1):
                  safe = p.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f"::notice::[{tag}#{idx}/{min(len(parts), max_ann)}/{len(parts)}] {safe}")

          root = pathlib.Path("/tmp/sl_zip")
          p = next(root.rglob("*tt1190634-5x08.html"))
          txt = p.read_text(errors="replace")
          clean = re.sub(r'<style[^>]*class="darkreader[^"]*"[^>]*>[\s\S]*?</style>', '', txt)
          emit("PSH_PART2", clean[55000:110000], max_ann=10)
          PY

      - name: Dump tt1190634-5x08.html part 3 and TT45368240 part 2
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re

          def emit(tag, text, max_ann=10, chunk=5500):
              parts = [text[i:i+chunk] for i in range(0, len(text), chunk)] or [""]
              for idx, p in enumerate(parts[:max_ann], 1):
                  safe = p.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f"::notice::[{tag}#{idx}/{min(len(parts), max_ann)}/{len(parts)}] {safe}")

          root = pathlib.Path("/tmp/sl_zip")
          p = next(root.rglob("*tt1190634-5x08.html"))
          clean_psh = re.sub(r'<style[^>]*class="darkreader[^"]*"[^>]*>[\s\S]*?</style>', '', p.read_text(errors="replace"))
          emit("PSH_PART3", clean_psh[110000:], max_ann=5)

          p2 = next(root.rglob("*tt45368240.html"))
          clean_e69 = re.sub(r'<style[^>]*class="darkreader[^"]*"[^>]*>[\s\S]*?</style>', '', p2.read_text(errors="replace"))
          emit("TT45368240_PART2", clean_e69[55000:], max_ann=5)
          PY
