name: Repro SoloLatino Android 13
on:
  push:
    branches:
      - 'arena/**'
permissions:
  contents: read
jobs:
  android_repro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare KVM and repro runner script
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          cat > /tmp/run_repro.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          cat > SoloLatino/src/main/kotlin/com/menorah/sololatino/ReproProbe.kt <<'KOTLIN'
          package com.menorah.sololatino

          import android.content.Context
          import android.util.Log
          import com.lagradost.cloudstream3.MainPageRequest
          import kotlinx.coroutines.*
          import java.util.Collections

          object ReproProbe {
              fun start(context: Context) {
                  val prev = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { t, e ->
                      Log.e("SLReproFatal", "UNCAUGHT thread=${t.name}: ${e.javaClass.name}: ${e.message}", e)
                      prev?.uncaughtException(t, e)
                  }
                  Log.i("SLRepro", "START sdk=${android.os.Build.VERSION.SDK_INT}")
                  CoroutineScope(SupervisorJob() + Dispatchers.IO).launch {
                      delay(3500)
                      val p = SoloLatinoProvider(context)
                      Log.i("SLRepro", "UA=${p.client.currentUserAgent()}")
                      // 1. Test getMainPage parallel (4 cats like CloudStream Home)
                      val cats = p.mainPage.take(4)
                      val mainRes = coroutineScope {
                          cats.map { mp ->
                              async {
                                  val t0 = System.currentTimeMillis()
                                  val r = runCatching { p.getMainPage(1, MainPageRequest(mp.name, mp.data, mp.horizontalImages)) }
                                  Log.i("SLRepro", "MAIN cat=${mp.name} ms=${System.currentTimeMillis()-t0} ok=${r.isSuccess} size=${r.getOrNull()?.items?.size} err=${r.exceptionOrNull()?.javaClass?.simpleName}:${r.exceptionOrNull()?.message}")
                                  r.getOrNull()
                              }
                          }.awaitAll()
                      }
                      val firstItem = mainRes.filterNotNull().flatMap { it.items }.firstOrNull()
                      Log.i("SLRepro", "MAIN_FIRST=${firstItem?.name} url=${firstItem?.url}")
                      // 2. Test search
                      val sr = runCatching { p.search("The Boys") }
                      Log.i("SLRepro", "SEARCH ok=${sr.isSuccess} size=${sr.getOrNull()?.size} err=${sr.exceptionOrNull()?.message}")
                      // 3. Test load
                      for (u in listOfNotNull(firstItem?.url, "https://sololatino.net/pelicula/puedes-verlo-todo", "https://sololatino.net/serie/the-boys-2019").distinct()) {
                          val t0 = System.currentTimeMillis()
                          val lr = runCatching { p.load(u) }
                          Log.i("SLRepro", "LOAD url=$u ms=${System.currentTimeMillis()-t0} ok=${lr.isSuccess} type=${lr.getOrNull()?.javaClass?.simpleName} err=${lr.exceptionOrNull()?.message}")
                      }
                      // 4. Test loadLinks
                      for (d in listOf(
                          "https://sololatino.net/pelicula/puedes-verlo-todo",
                          "https://sololatino.net/serie/the-boys-2019/temporada-5/episodio-8"
                      )) {
                          val links = Collections.synchronizedList(mutableListOf<String>())
                          val subs = Collections.synchronizedList(mutableListOf<String>())
                          val t0 = System.currentTimeMillis()
                          val ll = runCatching {
                              withTimeout(95_000L) {
                                  p.loadLinks(d, false, { subs.add(it.url) }) { links.add("${it.name}|${it.url.take(70)}") }
                              }
                          }
                          Log.i("SLRepro", "LOADLINKS data=$d ms=${System.currentTimeMillis()-t0} ok=${ll.isSuccess} ret=${ll.getOrNull()} links=${links.size} subs=${subs.size} err=${ll.exceptionOrNull()?.javaClass?.simpleName}:${ll.exceptionOrNull()?.message}")
                          links.take(10).forEach { Log.i("SLRepro", "LINK=$it") }
                      }
                      // 5. Direct fetchExternalHtml check on embed69 & voe
                      val e69 = runCatching {
                          p.client.fetchExternalHtml("https://embed69.org/f/tt45368240", "https://sololatino.net/") {
                              it.contains("embed69")
                          }
                      }
                      Log.i("SLRepro", "DIRECT_E69 ok=${e69.isSuccess} code=${e69.getOrNull()?.code} len=${e69.getOrNull()?.text?.length} hasDataLink=${e69.getOrNull()?.text?.contains("dataLink")} err=${e69.exceptionOrNull()?.message}")
                      Log.i("SLRepro", "WAIT_20S_FOR_CRASH_CHECK")
                      delay(20_000)
                      Log.i("SLRepro", "DONE_STILL_ALIVE")
                  }
              }
          }
          KOTLIN
          python3 - <<'PY'
          p = 'SoloLatino/src/main/kotlin/com/menorah/sololatino/SoloLatinoPlugin.kt'
          s = open(p).read().replace(
              'registerExtractorAPI(SoloLatinoGDriveExtractor())',
              'registerExtractorAPI(SoloLatinoGDriveExtractor()); ReproProbe.start(context)',
          )
          assert 'ReproProbe.start(context)' in s
          open(p, 'w').write(s)

          sp = 'SoloLatino/src/main/kotlin/com/menorah/sololatino/SoloLatinoSession.kt'
          ss = open(sp).read()
          assert 'import android.webkit.WebViewClient' in ss
          ss = ss.replace(
              'import android.webkit.WebViewClient',
              'import android.util.Log\nimport android.webkit.WebViewClient',
              1,
          )
          target_diag = 'lastDiag = "status=$httpStatus ready=$readyState cf=$isCf title=${title.take(40)} body=${bodySample.take(80)} url=${pageUrl.take(80)} len=${pageText.length}"'
          assert target_diag in ss
          ss = ss.replace(
              target_diag,
              target_diag + '; Log.i("SLReproWV", "DIAG $targetUrl " + lastDiag)',
          )
          target_to = 'finish(Result.failure(IllegalStateException("WebView agotó el tiempo cargando SoloLatino [$lastDiag blocked=$blocked js=$jsErr]")))'
          assert target_to in ss
          ss = ss.replace(
              target_to,
              'Log.e("SLReproWV", "TIMEOUT_SITE $targetUrl $lastDiag blocked=$blocked js=$jsErr"); ' + target_to,
          )
          target_rg = 'override fun onRenderProcessGone(view: WebView?, detail: RenderProcessGoneDetail?): Boolean {'
          assert target_rg in ss
          ss = ss.replace(
              target_rg,
              target_rg + ' Log.e("SLReproWV", "RENDER_GONE didCrash=${detail?.didCrash()}"); ',
          )
          open(sp, 'w').write(ss)
          PY

          set +e
          ./gradlew :SoloLatino:make --stacktrace > build.log 2>&1
          bstatus=$?
          if [ "$bstatus" -ne 0 ] && grep -q '429' build.log; then
            sleep 8
            ./gradlew :SoloLatino:make --stacktrace > build.log 2>&1
            bstatus=$?
          fi
          set -e
          if [ "$bstatus" -ne 0 ]; then
            errs=$(grep -E '^e: |^> |Caused by:|What went wrong:' build.log | head -20 | tr '\n' '|' | sed 's/%/%25/g')
            echo "::error::BUILD_FAILED($bstatus): $errs"
            exit "$bstatus"
          fi
          test -f SoloLatino/build/SoloLatino.cs3

          curl -fL --retry 3 https://github.com/recloudstream/cloudstream/releases/download/pre-release/app-prerelease-release.apk -o /tmp/cs.apk
          adb install -r /tmp/cs.apk
          pkg=com.lagradost.cloudstream3.prerelease
          adb shell pm grant "$pkg" android.permission.READ_EXTERNAL_STORAGE || true
          adb shell pm grant "$pkg" android.permission.WRITE_EXTERNAL_STORAGE || true
          adb shell appops set "$pkg" MANAGE_EXTERNAL_STORAGE allow || true
          adb shell mkdir -p /sdcard/Cloudstream3/plugins
          adb push SoloLatino/build/SoloLatino.cs3 /sdcard/Cloudstream3/plugins/SoloLatino.cs3
          adb logcat -c
          adb shell monkey -p "$pkg" 1

          set +e
          for i in $(seq 1 55); do
            sleep 5
            pid=$(adb shell pidof "$pkg" 2>/dev/null | tr -d '\r' || true)
            log=$(adb logcat -d -s SLRepro:V SLReproWV:V SLReproFatal:V '*:S' 2>/dev/null || true)
            if echo "$log" | grep -q 'DONE_STILL_ALIVE'; then
              break
            fi
            if [ "$i" -gt 4 ] && [ -z "$pid" ]; then
              echo "::notice::PROCESS_DIED_AT_STEP_$i"
              break
            fi
          done
          pid_final=$(adb shell pidof "$pkg" 2>/dev/null | tr -d '\r' || true)
          full_log=$(adb logcat -d -s SLRepro:V SLReproWV:V SLReproFatal:V PluginManager:W AndroidRuntime:E chromium:E cr_Crash:E libc:F DEBUG:F ActivityManager:E '*:S' 2>/dev/null | tail -n 220)
          python3 - "$pid_final" "$full_log" <<'PY'
          import sys
          text = f"PID_FINAL={sys.argv[1]}\n" + sys.argv[2]
          chunks = [text[i:i+3500] for i in range(0, len(text), 3500)]
          for idx, ch in enumerate(chunks[:10]):
              safe = ch.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::notice title=REPRO_{idx:02d}of{len(chunks):02d}::{safe}')
          PY
          EOF
          chmod +x /tmp/run_repro.sh
      - name: Run Android 13 CloudStream Repro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: /tmp/run_repro.sh
