name: Inspect SoloLatino ZIP

on:
  push:
    branches:
      - arena/**

jobs:
  hosts_live_check:
    runs-on: ubuntu-latest
    steps:
      - name: Install curl_cffi
        run: python3 -m pip install -q curl_cffi

      - name: Probe morencius + voe.sx + mirrors
        run: |
          python3 - <<'PY'
          import re
          from curl_cffi import requests as creq
          s = creq.Session(impersonate="chrome131")
          urls = [
              ("morencius_embed", "https://morencius.com/embed/gd8e0adu6pbg", "https://embed69.org/"),
              ("morencius_v", "https://morencius.com/v/gd8e0adu6pbg", "https://embed69.org/"),
              ("callistanise_embed", "https://callistanise.com/embed/gd8e0adu6pbg", "https://embed69.org/"),
              ("voe_sx", "https://voe.sx/e/84emedzn9bzh", "https://embed69.org/"),
          ]
          out = []
          for name, u, ref in urls:
              try:
                  r = s.get(u, headers={"Referer": ref}, timeout=15)
                  has_eval = "eval(function(p,a,c,k,e,d)" in r.text
                  has_altcha = "altcha-widget" in r.text
                  has_appjson = "application/json" in r.text
                  m_redir = re.findall(r"location\.href\s*=\s*['\"]([^'\"]+)", r.text)
                  title = re.findall(r"<title[^>]*>(.*?)</title>", r.text, re.S)
                  out.append(f"[{name}] code={r.status_code} final={r.url} len={len(r.text)} eval={has_eval} altcha={has_altcha} json={has_appjson} redir={m_redir} title={title}")
                  if name == "morencius_embed":
                      out.append("MORENCIUS_SNIP:\n" + r.text[:2500])
              except Exception as e:
                  out.append(f"[{name}] ERR={e}")
          msg = "\n".join(out)
          for idx in range(0, len(msg), 3400):
              safe = msg[idx:idx+3400].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f"::notice title=HOSTS_LIVE#{idx//3400+1}::{safe}")
          PY
