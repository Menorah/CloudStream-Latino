name: Inspeccionar HTML del usuario
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['scripts/inspect_user_html.py', '.github/workflows/inspect-user-html.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar beautifulsoup4
        run: pip install beautifulsoup4
      - name: Descargar y analizar paginaweb.zip
        run: python3 scripts/inspect_user_html.py
