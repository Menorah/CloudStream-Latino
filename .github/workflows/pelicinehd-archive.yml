name: Archivo HTML PeliCineHD
# Cloudflare bloquea las IP de los runners, así que el HTML real se toma del archivo web
# y se publica en la rama para escribir el analizador contra el DOM verdadero.
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'scripts/pelicinehd_probe/fetch_archive.py'
      - '.github/workflows/pelicinehd-archive.yml'
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/pelicinehd_probe/fetch_archive.py
      - name: Publicar el HTML archivado
        if: always()
        run: |
          ls -la probe-results | head -20
          if [ -d probe-results ] && [ -n "$(ls -A probe-results)" ]; then
            git config user.name "probe" && git config user.email "probe@example.com"
            git add -f probe-results && git commit -q -m "Archived pelicinehd HTML" || true
            git push origin HEAD:arena/77383897-cloudstream-latino || true
          fi
