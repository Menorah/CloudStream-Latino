name: Verificación real PeliCineHD
# Recorre contra el sitio real el mismo flujo que ejecuta el complemento.
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'scripts/pelicinehd_live.py'
      - '.github/workflows/pelicinehd-live.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/pelicinehd_live.py
