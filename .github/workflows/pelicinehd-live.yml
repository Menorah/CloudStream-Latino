name: Verificación real PeliCineHD
# Comprueba el analizador del complemento contra el sitio real desde el runner.
# El runner no tiene WebView y su IP suele recibir el desafío de Cloudflare: cuando eso
# ocurre, el flujo lo informa (challenge=true) en vez de fingir un fallo del complemento.
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'PeliCineHD/**'
      - 'scripts/pelicinehd_live.py'
      - '.github/workflows/pelicinehd-live.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sondear catálogo, ficha, temporadas y reproductores
        run: python3 scripts/pelicinehd_live.py | tee live.txt
      - name: Anotar el resumen
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib
          text = pathlib.Path('live.txt').read_text(errors='replace') if pathlib.Path('live.txt').exists() else 'sin salida'
          for line in text.splitlines()[:40]:
              print('::notice::' + line.replace('%', '%25').replace('\n', '%0A'))
          PY
