name: PelicineHD live probe (temporal)
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/pelicinehd-live.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Sondear el sitio real
        shell: bash
        run: |
          mkdir -p _live
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          get() { # url outfile [extra curl args...]
            local url="$1"; local out="$2"; shift 2
            code=$(curl -sSL -m 60 -A "$UA" -H "Accept-Language: es-AR,es;q=0.9" --compressed -o "_live/$out" -w '%{http_code}' "$@" "$url")
            echo "$code $url -> $out ($(stat -c%s "_live/$out" 2>/dev/null || echo 0) bytes)"
          }
          get "https://pelicinehd.com/" home.html
          get "https://pelicinehd.com/peliculas/" movies.html
          get "https://pelicinehd.com/peliculas/page/2/" movies2.html
          get "https://pelicinehd.com/series/" series.html
          get "https://pelicinehd.com/?s=avatar" search.html
          get "https://pelicinehd.com/movies/la-odisea/" movie.html
          get "https://pelicinehd.com/series/el-senor-de-los-anillos-los-anillos-de-poder/" show.html
          get "https://pelicinehd.com/episode/el-senor-de-los-anillos-los-anillos-de-poder-1x1/" episode.html
          get "https://pelicinehd.com/release/2026/" release.html
          get "https://pelicinehd.com/category/accion/" category.html
          echo "--- theme js urls"
          grep -o 'https://pelicinehd.com/wp-content/themes/[^"]*\.js[^"]*' _live/home.html | sort -u | head -20
          grep -o 'https://pelicinehd.com/wp-includes/js/[^"]*\.js[^"]*' _live/home.html | sort -u | head
          echo "--- plug ins js"
          grep -o 'https://pelicinehd.com/wp-content/plugins/[^"]*\.js[^"]*' _live/home.html _live/show.html | sort -u | head -20
      - name: Descargar JS del tema
        shell: bash
        run: |
          mkdir -p _live/js
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          grep -ho 'https://pelicinehd.com/[^"]*\.js[^"]*' _live/*.html | sed 's/&amp;/\&/g' | sort -u | head -40 > _live/jsurls.txt
          cat _live/jsurls.txt
          i=0
          while read -r u; do
            i=$((i+1))
            curl -sSL -m 60 -A "$UA" --compressed -o "_live/js/$i.js" "$u" || true
            echo "$i $u $(stat -c%s "_live/js/$i.js" 2>/dev/null || echo 0)"
          done < _live/jsurls.txt
      - name: Publicar
        if: always()
        shell: bash
        run: |
          du -sh _live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f _live
          git commit -m "probe: pelicinehd live" || echo "sin cambios"
          git push origin HEAD:${{ github.ref_name }}
