name: Diagnóstico PeliCineHD
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['scripts/pelicinehd_probe.py', '.github/workflows/pelicinehd-probe.yml']
permissions:
  contents: read
jobs:
  browser_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4 seleniumbase
      - name: Inspeccionar pelicinehd.com con SeleniumBase UC + Xvfb
        run: xvfb-run -a python3 scripts/pelicinehd_probe.py
