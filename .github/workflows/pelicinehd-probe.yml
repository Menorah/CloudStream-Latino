name: Sondeo PeliCineHD
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'scripts/pelicinehd_probe.py'
      - '.github/workflows/pelicinehd-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/pelicinehd_probe.py
