name: Pruebas de PeliCineHD
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['PeliCineHD/**', '.github/workflows/pelicinehd-tests.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas de análisis en JVM
        run: ./gradlew -PenablePeliCineHD=true :PeliCineHD:testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PeliCineHD-test-results
          path: PeliCineHD/build/test-results/
          if-no-files-found: ignore
