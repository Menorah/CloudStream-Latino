name: Páginas del usuario PeliCineHD
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'scripts/pelicinehd_user_pages.py'
      - '.github/workflows/pelicinehd-user-pages.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y descomprimir el ZIP
        run: python3 scripts/pelicinehd_user_pages.py
      - name: Publicar las páginas en la rama
        if: always()
        run: |
          ls -la user-pages | head -40
          git config user.name "probe" && git config user.email "probe@example.com"
          git add -f user-pages && git commit -q -m "Páginas HTML aportadas por el usuario" || true
          git pull --rebase -q origin arena/77383897-cloudstream-latino || true
          git push origin HEAD:arena/77383897-cloudstream-latino || true
