name: Sondeo WebView PeliCineHD
# Extrae el HTML real de pelicinehd.com y las peticiones que hace la ficha, con un WebView
# de Android igual que el que usa CloudStream (Cloudflare bloquea las IP de los runners).
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'scripts/pelicinehd_probe/**'
      - '.github/workflows/pelicinehd-webview.yml'
permissions:
  contents: write
jobs:
  webview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Extraer módulos del complemento
        run: |
          ./gradlew :RePelis24Shop:make --stacktrace
          python3 scripts/pelicinehd_probe/dex_classes.py RePelis24Shop/build/RePelis24Shop.cs3
      - name: Ejecutar sondeo con WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/pelicinehd_probe/run.sh
      - name: Publicar el HTML capturado en la rama
        if: always()
        run: |
          if [ -d probe-out ] && [ -n "$(ls -A probe-out)" ]; then
            mkdir -p probe-results
            cp probe-out/* probe-results/ 2>/dev/null || true
            git config user.name "probe"
            git config user.email "probe@example.com"
            git add -f probe-results
            git commit -m "Probe output: pelicinehd DOM" || true
            git push origin HEAD:arena/77383897-cloudstream-latino || true
          fi
      - name: Guardar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pelicinehd-probe
          path: |
            modules.json
            probe-*.html
            probe-requests.json
            probe-*.log
          if-no-files-found: ignore
VACUOUS=1
