name: Diagnóstico PelisJuanita/PeliCineHD
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['scripts/pelisjuanita_api_probe.py', '.github/workflows/pelis-juanita-api.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probar la API de la app y los jugadores Dooplay
        run: python3 scripts/pelisjuanita_api_probe.py
