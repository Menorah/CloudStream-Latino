name: Probe PelisEnHD
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['scripts/pelisenhd_probe.py', '.github/workflows/pelisenhd-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install beautifulsoup4 playwright
      - run: python3 scripts/pelisenhd_probe.py
      - name: Check financialtrust with headless Chromium
        run: |
          python3 -m playwright install chromium
          python3 - <<'PY'
          import json
          from playwright.sync_api import sync_playwright

          movie_url = "https://pelisenhd.org/pelicula-240525/el-camino-del-pequeno-guerrero-web-dl-4k-uhd-hdr10-dv-2026/"
          def emit(tag, obj):
              raw = json.dumps({"tag": tag, "data": obj}, ensure_ascii=False)
              print(f"::notice title={tag}::" + raw.replace("%", "%25").replace("\r", " ").replace("\n", "\\n")[:3900], flush=True)

          with sync_playwright() as p:
              b = p.chromium.launch(headless=True)
              ctx = b.new_context(viewport={"width": 1280, "height": 800})
              pg = ctx.new_page()
              reqs = []
              pg.on("response", lambda r: reqs.append((r.status, r.url[:140])) if len(reqs) < 40 else None)
              pg.goto(movie_url, wait_until="domcontentloaded", timeout=30000)
              href = pg.eval_on_selector("a[href*='financialtrust']", "el => el.href")
              emit("pw_movie", {"ft_href": href, "title": pg.title()})
              if href:
                  pg2 = ctx.new_page()
                  pg2.on("response", lambda r: emit("pw_resp", {"st": r.status, "u": r.url[:180], "ct": r.headers.get("content-type", "")}) if "financialtrust" in r.url or "hdpastes" in r.url or "mega" in r.url or "mediafire" in r.url or "1fichier" in r.url or "captcha" in r.url or r.status >= 300 else None)
                  # Click the link on the real movie page to preserve exact Referer & user gesture
                  with ctx.expect_page() as new_pg_info:
                      pg.click("a[href*='financialtrust']")
                  new_pg = new_pg_info.value
                  new_pg.wait_for_load_state("domcontentloaded", timeout=20000)
                  new_pg.wait_for_timeout(4000)
                  emit("pw_ft_page", {
                      "url": new_pg.url,
                      "title": new_pg.title(),
                      "text": new_pg.inner_text("body")[:800],
                      "links": new_pg.eval_on_selector_all("a[href]", "els => els.slice(0, 20).map(e => [e.innerText.trim(), e.href])"),
                      "html_head": new_pg.content()[:1500],
                  })
              b.close()
          PY
