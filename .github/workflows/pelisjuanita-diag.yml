name: Sonda Busqueda y Skin Crawler Diag
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/pelisjuanita-diag.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar busqueda.zip e inspeccionar muestras
        shell: python3 {0}
        run: |
          import io, json, re, urllib.request, urllib.parse, http.cookiejar, zipfile

          def emit(title, text):
              for i in range(0, len(text), 3500):
                  chunk = text[i:i+3500].replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
                  print(f'::notice title={title}_{i//3500}::{chunk}')

          cj = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          opener.addheaders = [('User-Agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36')]

          # 1. Fetch tmpfiles landing page to get cookies + exact dl URL
          landing = opener.open('https://tmpfiles.org/w5Azv6U6dMIa/busqueda.zip', timeout=30).read().decode('utf-8', 'replace')
          m = re.search(r'https://tmpfiles\.org/dl/[^\s"\'<>]+', landing)
          dl_url = m.group(0) if m else 'https://tmpfiles.org/dl/1795723455.3351d41c3ae45629/w5Azv6U6dMIa/busqueda.zip'
          data = opener.open(dl_url, timeout=60).read()
          emit('zip_meta', f'dl_url={dl_url} bytes={len(data)}')

          zf = zipfile.ZipFile(io.BytesIO(data))
          listing = [f'{info.filename} ({info.file_size}b)' for info in zf.infolist()]
          emit('zip_list', '\n'.join(listing))

          for info in zf.infolist():
              name = info.filename
              if any(name.lower().endswith(ext) for ext in ('.html', '.htm', '.js', '.json', '.php', '.txt')):
                  content = zf.read(name).decode('utf-8', 'replace')
                  if name.lower().endswith(('.html', '.htm', '.js', '.json', '.txt')):
                      # Trim huge inline base64 or repeated SVGs if any
                      trimmed = re.sub(r'data:image/[^"\')\s]{100,}', 'data:image/TRUNC', content)
                      emit(f'file_{name.replace("/", "_")[-40:]}', trimmed[:25000])

          # 2. Check Vimeus and buscar.php for The Skin Crawler Murders (TMDbId=1843139, id=55869)
          for label, url in [
              ('buscar_skin', 'https://pelisjuanita.com/tv/app/buscar.php?q=skin%20crawler&pagina=1'),
              ('buscar_slug', 'https://pelisjuanita.com/tv/app/buscar.php?q=the-skin-crawler-murders&pagina=1'),
              ('vimeus_1843139', 'https://vimeus.net/e/movie?tmdb=1843139&view_key=D3dX7LTo6CgnhLGPyKahD9gDNZ2n82wJ2mpWu-SjS0M&title=Pelisjuanita&theme=minimal&autoplay=1'),
              ('tv_detalle_55869', 'https://pelisjuanita.com/tv/app/detalle.php?id=55869'),
              ('tv_ver_55869', 'https://pelisjuanita.com/tv/app/ver.php?id=55869'),
          ]:
              try:
                  req = urllib.request.Request(url, headers={'Referer': 'https://pelisjuanita.com/'})
                  resp = opener.open(req, timeout=15)
                  emit(label, f'code={resp.status} url={resp.geturl()} body={resp.read().decode("utf-8", "replace")[:6000]}')
              except urllib.error.HTTPError as e:
                  emit(label, f'code={e.code} url={e.geturl()} body={e.read().decode("utf-8", "replace")[:2000]}')
              except Exception as e:
                  emit(label, f'err={e}')
