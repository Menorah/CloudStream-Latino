name: Sonda Busqueda y Skin Crawler Diag
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/pelisjuanita-diag.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extraer pagination y script_hits de busqueda.zip
        shell: python3 {0}
        run: |
          import io, re, urllib.request, http.cookiejar, zipfile

          def emit(title, text):
              for i in range(0, len(text), 3500):
                  chunk = text[i:i+3500].replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
                  print(f'::notice title={title}_{i//3500}::{chunk}')

          cj = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          opener.addheaders = [('User-Agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36')]

          landing = opener.open('https://tmpfiles.org/w5Azv6U6dMIa/busqueda.zip', timeout=30).read().decode('utf-8', 'replace')
          dl_url = re.search(r'https://tmpfiles\.org/dl/[^\s"\'<>]+', landing).group(0)
          zf = zipfile.ZipFile(io.BytesIO(opener.open(dl_url, timeout=60).read()))

          for info in zf.infolist():
              low = info.filename.lower()
              if low.endswith('.html') or low.endswith('.htm'):
                  raw = zf.read(info.filename).decode('utf-8', 'replace')
                  # Extract tail after grid-container items
                  pag_idx = raw.find('class="pagination"')
                  if pag_idx > 0:
                      emit('pag_html', raw[pag_idx-200:pag_idx+2500])
                  for m_i, m in enumerate(re.finditer(r'(?s)<script\b[^>]*>(.*?)</script>', raw)):
                      sc = m.group(1).strip()
                      if sc and any(w in sc.lower() for w in ['cargar', 'search', 'buscar', 'pelicula', 'serie', 'fetch', 'movieinfo', 'serieinfo']):
                          emit(f'inline_{m_i}', sc[:6000])
              elif low.endswith('script.js.download'):
                  sc = zf.read(info.filename).decode('utf-8', 'replace')
                  lines = sc.splitlines()
                  hits = [f'{i+1}: {l}' for i, l in enumerate(lines) if any(w in l.lower() for w in ['cargarseries', 'cargarpeliculas', 'search', 'buscar', 's=', 'ver-serie', 'pelicula', 'movieinfo', 'serieinfo', 'data-url', 'idioma', 'subt'])]
                  emit('script_hits', '\n'.join(hits))
