name: Sonda PelisJuanita
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['scripts/pelisjuanita_probe.py', '.github/workflows/pelisjuanita-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/pelisjuanita_probe.py
