name: Sonda PelisJuanita
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['scripts/pelisjuanita_probe.py', '.github/workflows/pelisjuanita-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -c "import bs4" 2>/dev/null || python3 -m pip install --break-system-packages -q beautifulsoup4
      - run: python3 scripts/pelisjuanita_probe.py --download --part ${{ matrix.part }}
