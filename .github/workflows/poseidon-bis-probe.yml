name: Probe PoseidonHD2 bis
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/poseidon-bis-probe.yml', 'scripts/poseidon_bis_probe.py']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe search JS and pagination
        run: python3 scripts/poseidon_bis_probe.py search_js
      - name: Inspect all cyberlocker hosts live
        run: python3 scripts/poseidon_bis_probe.py inspect_all_hosts
