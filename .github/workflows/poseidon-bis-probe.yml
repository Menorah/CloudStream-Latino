name: Probe PoseidonHD2 bis
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/poseidon-bis-probe.yml', 'scripts/poseidon_bis_probe.py']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe search pagination and JS chunks
        run: python3 scripts/poseidon_bis_probe.py search_and_chunks
      - name: Probe player.php internals and cyberlocker hosts
        run: python3 scripts/poseidon_bis_probe.py player_html_and_hosts
