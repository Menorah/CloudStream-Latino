name: Probe PoseidonHD2 bis
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/poseidon-bis-probe.yml', 'scripts/poseidon_bis_probe.py']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe paging, genres and buildManifest
        run: python3 scripts/poseidon_bis_probe.py paging
      - name: Probe movie videos, series seasons and search
        run: python3 scripts/poseidon_bis_probe.py movie_and_season
      - name: Probe player.php resolution across hosts
        run: python3 scripts/poseidon_bis_probe.py players
