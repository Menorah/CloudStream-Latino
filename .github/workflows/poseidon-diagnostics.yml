name: Diagnóstico PoseidonHD2
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['scripts/poseidon_next_probe.py', '.github/workflows/poseidon-diagnostics.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/poseidon_next_probe.py
