name: Diagnóstico de servidores Poseidon
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['scripts/poseidon_hosts_probe.py', '.github/workflows/poseidon-hosts-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/poseidon_hosts_probe.py latino
      - run: python3 scripts/poseidon_hosts_probe.py spanish
      - run: python3 scripts/poseidon_hosts_probe.py english
