name: Diagnóstico servidores de series Poseidon
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['scripts/poseidon_series_hosts_probe.py', '.github/workflows/poseidon-series-hosts-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/poseidon_series_hosts_probe.py
