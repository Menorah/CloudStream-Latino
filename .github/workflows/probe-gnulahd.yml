name: Probe GnulaHD Final Verification
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/probe-gnulahd.yml']
permissions:
  contents: read
jobs:
  final_live_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q beautifulsoup4 requests
      - name: Auditar extractores en vivo, paginacion de busqueda, anime movie, posts sin srvs y logo/poster headers
        run: |
          python3 - <<'PY'
          import base64, json, re, requests
          from bs4 import BeautifulSoup

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36"
          S = requests.Session()
          S.headers.update({"User-Agent": UA, "Referer": "https://ww3.gnulahd.nu/"})

          # 1. Check amor-sin-medida (why srvs=[]) + anime movie + header brand logo!
          r_home = S.get("https://ww3.gnulahd.nu/", timeout=20)
          sp_h = BeautifulSoup(r_home.text, "html.parser")
          logo_dom = str(sp_h.select_one("header .gnrd-logo, header a[href='https://ww3.gnulahd.nu/'], .gnrd-brand"))[:500]
          print("::notice::HEADER_LOGO=" + re.sub(r"\s+", " ", logo_dom).replace("%", "%25"))

          for lbl, u in [
              ("NO_SRV", "https://ww3.gnulahd.nu/ver/amor-sin-medida/"),
              ("ANIME_MOV", "https://ww3.gnulahd.nu/ver/dragon-ball-z-los-dos-guerreros-del-futuro-gohan-y-trunks/"),
              ("VIDSONIC_OLD", "https://ww3.gnulahd.nu/ver/scary-movie-3/"),
              ("EP_CROWN", "https://ww3.gnulahd.nu/the-crown-1x01/"),
          ]:
              r = S.get(u, timeout=20)
              sp = BeautifulSoup(r.text, "html.parser")
              ey = (sp.select_one(".gnrd-eyebrow") or sp.select_one(".gnrd-fi-eyebrow"))
              pid = re.search(r'_gnrdPid\s*=\s*(\d+)', r.text)
              tok = re.search(r'_gnrdTok\s*=\s*"([^"]+)"', r.text)
              ep_cnt = len(sp.select("a.gnrd-epc"))
              # Check player JSON if pid/tok
              srvs = []
              if pid and tok:
                  rp = S.get(f"https://ww3.gnulahd.nu/wp-json/gnrd/v1/player?id={pid.group(1)}&t={tok.group(1)}", headers={"User-Agent": UA, "Referer": u}, timeout=20)
                  if rp.status_code == 200:
                      raw = base64.b64decode(rp.json().get("p", ""))
                      d = json.loads(bytes(b ^ [103,78,55,100][i & 3] for i, b in enumerate(raw)).decode("utf-8"))
                      srvs = [(l.get("label"), [sv.get("src") for sv in l.get("servers", [])]) for l in d.get("langs", [])]
              print(f"::notice::CHK_{lbl}=ey={ey.get_text(' ',strip=True) if ey else None!r} pid={pid.group(1) if pid else None} ep_cnt={ep_cnt} srvs={srvs}".replace("%", "%25")[:3200])

          # 2. Check search pagination & category URLs & 683x1024 poster headers
          pag_res = []
          for u in [
              "https://ww3.gnulahd.nu/?s=love",
              "https://ww3.gnulahd.nu/page/2/?s=love",
              "https://ww3.gnulahd.nu/?s=love&page=2",
              "https://ww3.gnulahd.nu/ver/peliculas/?orderby=views&page=2",
              "https://ww3.gnulahd.nu/ver/series/latino/",
              "https://ww3.gnulahd.nu/ver/anime/latino/",
              "https://ww3.gnulahd.nu/ver/anime/?orderby=views",
          ]:
              ru = S.get(u, timeout=20)
              su = BeautifulSoup(ru.text, "html.parser")
              c = len(su.select("a.gnrd-card"))
              first = (su.select_one("a.gnrd-card") or {}).get("href", "")
              pags = [(a.get_text(strip=True), a.get("href")) for a in su.select(".gnrd-pag a, .pagination a")]
              pag_res.append(f"{u}=>{ru.status_code} cards={c} first={first.split('/ver/')[-1]} pags={pags[:4]}")
          print("::notice::PAG_TESTS=" + " || ".join(pag_res).replace("%", "%25")[:3500])

          # 3. Live test extractors: Savefiles, Vidara (strip #gnraw!), ByseVepoin, Voe, OkRu!
          ext_res = []
          # Savefiles POST /dl
          try:
              rsf = requests.post("https://savefiles.com/dl", data={"op":"embed","file_code":"4k581w054dxn","auto":"1","referer":"https://ww3.gnulahd.nu/"}, headers={"User-Agent": UA, "Referer": "https://savefiles.com/e/4k581w054dxn", "Origin": "https://savefiles.com"}, timeout=15)
              m_sf = re.findall(r'https?://[^\s"\'<>]+\.(?:m3u8|mp4)[^\s"\'<>]*', rsf.text)
              ext_res.append(f"Savefiles=>{rsf.status_code} streams={m_sf[:3]}")
          except Exception as e:
              ext_res.append(f"Savefiles=>ERR:{e}")

          # Vidara POST /api/stream (without #gnraw)
          for vd_u, code in [("https://vidara.to", "rll3Cm6mqgnLJ"), ("https://vidaraa.cc", "QGKzkFZxmQ9jM")]:
              try:
                  rvd = requests.post(f"{vd_u}/api/stream", json={"filecode": code, "device": "web"}, headers={"User-Agent": UA, "Referer": f"{vd_u}/e/{code}"}, timeout=15)
                  ext_res.append(f"{vd_u}=>{rvd.status_code} body={rvd.text[:250]}")
              except Exception as e:
                  ext_res.append(f"{vd_u}=>ERR:{e}")

          # ByseVepoin details -> playback
          try:
              rdet = requests.get("https://bysevepoin.com/api/videos/2n71086n81zc/embed/details", headers={"User-Agent": UA}, timeout=15)
              ext_res.append(f"ByseVepoin_det=>{rdet.status_code} body={rdet.text[:250]}")
          except Exception as e:
              ext_res.append(f"ByseVepoin=>ERR:{e}")

          # Voe live check on xlpslkgo8zlg
          try:
              rvoe = requests.get("https://voe.sx/e/xlpslkgo8zlg", headers={"User-Agent": UA, "Referer": "https://ww3.gnulahd.nu/"}, timeout=15, allow_redirects=True)
              ext_res.append(f"Voe=>{rvoe.status_code} final={rvoe.url} len={len(rvoe.text)} has_json={'application/json' in rvoe.text}")
          except Exception as e:
              ext_res.append(f"Voe=>ERR:{e}")

          # OkRu live check
          try:
              rok = requests.get("https://ok.ru/videoembed/13967573977684", headers={"User-Agent": UA}, timeout=15)
              ext_res.append(f"OkRu=>{rok.status_code} len={len(rok.text)} has_flash={'data-options' in rok.text or 'ondemandHls' in rok.text}")
          except Exception as e:
              ext_res.append(f"OkRu=>ERR:{e}")

          # 683x1024 poster bare okhttp vs cs_ua
          p_u = "https://ww3.gnulahd.nu/wp-content/uploads/2026/11/nzIXSQNgYZwFOMrmv0d0I3ulvkM-683x1024.webp"
          rb = requests.get(p_u, headers={"User-Agent": "okhttp/4.12.0"}, timeout=15)
          rc = requests.get(p_u, headers={"User-Agent": UA, "Referer": "https://ww3.gnulahd.nu/"}, timeout=15)
          ext_res.append(f"Poster683=>bare={rb.status_code} cs={rc.status_code}")

          print("::notice::EXTRACTOR_AND_IMG_PROBES=" + " || ".join(ext_res).replace("%", "%25")[:3500])
          PY
