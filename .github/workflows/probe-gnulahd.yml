name: Probe GnulaHD Icon Bytes
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/probe-gnulahd.yml']
permissions:
  contents: read
jobs:
  grab_icon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests pillow
      - name: Emitir LOGO_B64 (paso 1)
        run: |
          python3 - <<'PY'
          import base64, io, requests
          from PIL import Image
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36"
          r = requests.get("https://ww3.gnulahd.nu/wp-content/themes/dramastream-child/img/logo-gnula.png?v=1782785985", headers={"User-Agent": UA, "Referer": "https://ww3.gnulahd.nu/"}, timeout=15)
          b64 = base64.b64encode(r.content).decode("ascii")
          for i in range(0, len(b64), 3400):
              print(f"::notice::LOGO_{i//3400}=" + b64[i:i+3400])
          PY
      - name: Emitir FAV_B64 parte 1
        run: |
          python3 - <<'PY'
          import base64, io, requests
          from PIL import Image
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36"
          r = requests.get("https://ww3.gnulahd.nu/wp-content/uploads/2026/07/cropped-favicon-32x32-2-192x192.png", headers={"User-Agent": UA, "Referer": "https://ww3.gnulahd.nu/"}, timeout=15)
          im = Image.open(io.BytesIO(r.content)).convert("RGBA")
          buf = io.BytesIO()
          im.save(buf, format="PNG", optimize=True)
          b64 = base64.b64encode(buf.getvalue()).decode("ascii")
          open("/tmp/fav.b64", "w").write(b64)
          for i in range(0, min(len(b64), 21000), 3500):
              print(f"::notice::FAV_{i//3500:02d}=" + b64[i:i+3500])
          PY
      - name: Emitir FAV_B64 parte 2
        run: |
          python3 - <<'PY'
          b64 = open("/tmp/fav.b64").read()
          for i in range(21000, len(b64), 3500):
              print(f"::notice::FAV_{i//3500:02d}=" + b64[i:i+3500])
          PY
