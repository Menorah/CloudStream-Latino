name: Probe GnulaHD Player and APIs
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/probe-gnulahd.yml']
permissions:
  contents: read
jobs:
  inspect_zip_player_scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q beautifulsoup4 requests
      - name: Extraer scripts de reproductor, tabs, reparto, trailer, detalles, filtros del zip
        run: |
          python3 - <<'PY'
          import os, re, zipfile, requests
          from bs4 import BeautifulSoup

          r = requests.get("https://tmpfiles.org/wrAmvgh4G7Qr/ww3.gnulahd.nu.zip", timeout=20)
          m = re.search(r'https?://tmpfiles\.org/dl/[^"\'\s<>]+\.zip', r.text)
          dl_url = m.group(0) if m else "https://tmpfiles.org/dl/1795823170.36156a77def5f426/wrAmvgh4G7Qr/ww3.gnulahd.nu.zip"
          rz = requests.get(dl_url, timeout=60, stream=True)
          with open("/tmp/gnula.zip", "wb") as f:
              for c in rz.iter_content(65536): f.write(c)
          os.makedirs("/tmp/gnula", exist_ok=True)
          with zipfile.ZipFile("/tmp/gnula.zip") as zf:
              zf.extractall("/tmp/gnula")

          def find_file(sub):
              for root, _, fns in os.walk("/tmp/gnula"):
                  for fn in fns:
                      p = os.path.join(root, fn)
                      if p.lower().endswith(".html") and sub in p.lower():
                          return p
              return None

          # 1. Inspect ALL scripts containing gnrdOpenPlayer, gnrdTab, mirror, gnDev, wp-json, admin-ajax in MOVIE and SERIES!
          for tag, sub in [("MOVIE", "pelicula ejemplo"), ("SERIES", "serie ejemplo")]:
              html = open(find_file(sub), errors="replace").read()
              soup = BeautifulSoup(html, "html.parser")
              for el in soup.select("svg, style"): el.decompose()

              # Find scripts mentioning player/gnrdOpenPlayer/admin-ajax/wp-json/embed/gnDev
              hits = []
              for i, s in enumerate(soup.select("script:not([src])")):
                  t = s.get_text().strip()
                  if any(k in t for k in ["gnrdOpenPlayer", "gnrdTab", "gnDev", "admin-ajax", "wp-json/gnrd", "mirror", "embed", "player", "gnrd-epc"]):
                      hits.append(f"S{i}({len(t)}): " + re.sub(r"\s+", " ", t))
              joined = "\n".join(hits)
              for ci in range(0, min(len(joined), 12000), 3400):
                  print(f"::notice::{tag}_PLAYER_JS_{ci//3400}=" + joined[ci:ci+3400].replace("%", "%25").replace("\n", " || "))

              # Dump Reparto, Trailer, Detalles, Relacionados, and Player modal/overlay DOM
              sections = []
              for sel in [".gnrd-tabpanels", "[data-k='reparto']", "[data-k='trailer']", "[data-k='detalles']", "#gnrd-player", ".gnrd-player", ".gnrd-modal", ".gnrd-pm", "[id*='gnrd-p']", ".gnrd-rel", ".gnrd-related", ".gnrd-fi-side", ".gnrd-fi-poster"]:
                  el = soup.select_one(sel)
                  if el:
                      sections.append(f"[{sel}]=>" + re.sub(r"\s+", " ", str(el))[:900])
              # Also check elements near end of body (modals/overlays)
              for el in soup.select("body > div, body > section"):
                  eid = el.get("id", "")
                  cls = ".".join(el.get("class", []))
                  if any(k in (eid + cls).lower() for k in ["play", "modal", "ov", "player", "srv", "mir"]):
                      sections.append(f"[BODY_EL #{eid}.{cls}]=>" + re.sub(r"\s+", " ", str(el))[:1200])
              print(f"::notice::{tag}_SECTIONS=" + " || ".join(sections)[:3500].replace("%", "%25"))
          PY

  inspect_live_episode_and_player:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q beautifulsoup4 requests
      - name: Inspeccionar pagina de episodio, AJAX del reproductor, search JSON y poster headers
        run: |
          python3 - <<'PY'
          import re, json, requests
          from bs4 import BeautifulSoup

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36"
          S = requests.Session()
          S.headers.update({"User-Agent": UA, "Referer": "https://ww3.gnulahd.nu/"})

          # 1. Inspect live Movie & Episode pages for EXACT player JS/HTML & all data attributes
          for lbl, u in [
              ("LIVE_MOV", "https://ww3.gnulahd.nu/ver/los-juegos-del-hambre-amanecer-en-la-cosecha/"),
              ("LIVE_EP", "https://ww3.gnulahd.nu/the-crown-1x01/"),
              ("LIVE_ANIME_EP", "https://ww3.gnulahd.nu/bleach-2x50/"),
              ("LIVE_PROXIMOS", "https://ww3.gnulahd.nu/proximos-estrenos/"),
          ]:
              r = S.get(u, timeout=20)
              soup = BeautifulSoup(r.text, "html.parser")
              for el in soup.select("svg, style"): el.decompose()
              scripts = []
              for i, s in enumerate(soup.select("script:not([src])")):
                  t = s.get_text().strip()
                  if any(k in t for k in ["gnrdOpenPlayer", "gnrd", "admin-ajax", "wp-json", "embed", "iframe", "video", "player", "source", "mirror"]):
                      if "gntgp" not in t and "llvpn" not in t and "ts_config" not in t[:60]:
                          scripts.append(f"S{i}({len(t)}): " + re.sub(r"\s+", " ", t)[:1500])
              iframes = [dict(f.attrs) for f in soup.select("iframe")]
              data_btns = [(b.name, b.get("class"), {k:v for k,v in b.attrs.items() if k.startswith("data-") or k in ("id","onclick","href")}, b.get_text(" ", strip=True)[:50]) for b in soup.select("button, a, div, li") if any(k in str(b.attrs).lower() for k in ["player","mirror","srv","video","embed","play","lang","lat","sub","cast","gnrd-p"]) and not b.has_attr("data-darkreader-inline-stroke")][:25]
              print(f"::notice::{lbl}=status={r.status_code} iframes={iframes[:4]} btns={data_btns[:14]} scripts={' || '.join(scripts)[:2200]}".replace("%", "%25")[:3500])

          # 2. Test /wp-json/gnrd/v1/search?q=matrix & filters on Peliculas/Series/Anime
          api_checks = []
          for u in [
              "https://ww3.gnulahd.nu/wp-json/gnrd/v1/search?q=matrix",
              "https://ww3.gnulahd.nu/wp-json/gnrd/v1/search?q=the+crown",
              "https://ww3.gnulahd.nu/ver/peliculas/?genero=terror",
              "https://ww3.gnulahd.nu/ver/peliculas/?genero=terror&anio=2025",
              "https://ww3.gnulahd.nu/ver/peliculas/latino/?page=2",
              "https://ww3.gnulahd.nu/genres/terror/page/2/",
              "https://ww3.gnulahd.nu/genres/terror/?page=2",
          ]:
              r = S.get(u, timeout=20)
              if "json" in r.headers.get("Content-Type", ""):
                  api_checks.append(f"{u}=>{r.status_code} JSON:{r.text[:600]}")
              else:
                  sp = BeautifulSoup(r.text, "html.parser")
                  c = len(sp.select("a.gnrd-card"))
                  t = sp.title.get_text(strip=True) if sp.title else ""
                  pag = [(a.get_text(strip=True), a.get("href")) for a in sp.select(".gnrd-pag a, .pagination a, a[href*='page']")[:5]]
                  api_checks.append(f"{u}=>{r.status_code} final={r.url} title={t!r} cards={c} pag={pag}")
          print("::notice::API_AND_FILTERS=" + " || ".join(api_checks).replace("%", "%25")[:3500])

          # 3. Test poster image from ww3.gnulahd.nu/wp-content/uploads/ under bare OkHttp vs CS_UA!
          r_h = S.get("https://ww3.gnulahd.nu/", timeout=20)
          m_img = re.findall(r'https://ww3\.gnulahd\.nu/wp-content/uploads/[^\s"\'<>]+\.(?:webp|jpg|png)', r_h.text)
          poster_tests = []
          for u in list(dict.fromkeys(m_img))[:3]:
              rb = requests.get(u, headers={"User-Agent": "okhttp/4.12.0"}, timeout=15)
              rc = requests.get(u, headers={"User-Agent": UA, "Referer": "https://ww3.gnulahd.nu/"}, timeout=15)
              poster_tests.append(f"{u} => bare={rb.status_code}({rb.headers.get('Content-Type','')}) cs={rc.status_code}({rc.headers.get('Content-Type','')})")
          print("::notice::POSTER_HEADERS_CHECK=" + " || ".join(poster_tests).replace("%", "%25")[:3500])
          PY
