name: Probe GnulaHD Pagination and Episodes
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/probe-gnulahd.yml']
permissions:
  contents: read
jobs:
  check_pagination_episodes_icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q beautifulsoup4 requests pillow
      - name: Verificar selector paginacion, total episodios Bleach/OnePiece, OkRu/Vidsonic, y logo/favicon PNG
        run: |
          python3 - <<'PY'
          import io, re, requests
          from bs4 import BeautifulSoup
          from PIL import Image

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36"
          S = requests.Session()
          S.headers.update({"User-Agent": UA, "Referer": "https://ww3.gnulahd.nu/"})

          # 1. Exact HTML of pagination element on peliculas, genres, search, and last page
          pag_htmls = []
          for u in [
              "https://ww3.gnulahd.nu/ver/peliculas/",
              "https://ww3.gnulahd.nu/ver/peliculas/?page=464",
              "https://ww3.gnulahd.nu/genres/terror/",
              "https://ww3.gnulahd.nu/?s=love",
              "https://ww3.gnulahd.nu/page/5/?s=love",
              "https://ww3.gnulahd.nu/recien-agregado/",
          ]:
              r = S.get(u, timeout=20)
              sp = BeautifulSoup(r.text, "html.parser")
              # Find any element containing "Cargar más" or "›" or "?page=2" or "/page/2/"
              hits = []
              for el in sp.select("a[href*='page='], a[href*='/page/']"):
                  p_cls = ".".join(el.parent.get("class", [])) if el.parent else ""
                  pp_cls = ".".join(el.parent.parent.get("class", [])) if el.parent and el.parent.parent else ""
                  hits.append(f"{pp_cls}>{p_cls}>a({el.get_text(strip=True)})={el.get('href')}")
              pag_htmls.append(f"{u} => {hits[:6]}")
          print("::notice::PAG_EXACT=" + " || ".join(pag_htmls).replace("%", "%25")[:3500])

          # 2. Check Bleach, One Piece, The Crown full DOM episode counts + season/ep html sample + anime movie card!
          ep_checks = []
          for u in [
              "https://ww3.gnulahd.nu/ver/the-crown/",
              "https://ww3.gnulahd.nu/ver/bleach-2004/",
              "https://ww3.gnulahd.nu/ver/one-piece-1999/",
          ]:
              r = S.get(u, timeout=20)
              sp = BeautifulSoup(r.text, "html.parser")
              eps = sp.select("a.gnrd-epc")
              seasons = sorted(set(e.get("data-s", "") for e in eps))
              first_ep = re.sub(r"\s+", " ", str(eps[0]))[:450] if eps else ""
              last_ep = re.sub(r"\s+", " ", str(eps[-1]))[:450] if eps else ""
              # Recommendations section selector
              rel_cards = [(c.parent.get("class"), c.find_previous(["h2","h3"]).get_text(" ", strip=True) if c.find_previous(["h2","h3"]) else "") for c in sp.select("a.gnrd-card")[:2]]
              ep_checks.append(f"{u.split('/ver/')[-1]} cnt={len(eps)} seasons={seasons} first={first_ep} last={last_ep} rel={rel_cards}")
          print("::notice::EP_COUNTS=" + " || ".join(ep_checks).replace("%", "%25")[:3500])

          # 3. Check OkRu data-options vs videos & Vidsonic _0x1 + logo-gnula.png & favicon!
          rok = requests.get("https://ok.ru/videoembed/13967573977684", headers={"User-Agent": UA}, timeout=15)
          rvs = requests.get("https://vidsonic.net/e/gzihedvkxd57", headers={"User-Agent": UA, "Referer": "https://ww3.gnulahd.nu/"}, timeout=15)
          m_vs = re.search(r"const _0x1\s*=\s*'([^']+)'", rvs.text)
          vs_dec = ""
          if m_vs:
              hx = m_vs.group(1).replace("|", "")
              vs_dec = "".join(chr(int(hx[i:i+2], 16)) for i in range(0, len(hx), 2))[::-1]
          m_ok = re.search(r'data-options="([^"]+)"', rok.text)
          print("::notice::OK_VIDSONIC=" + f"ok_status={rok.status_code} ok_has_videos={'videos' in rok.text} ok_opts={bool(m_ok)} || vs_status={rvs.status_code} vs_dec={vs_dec}".replace("%", "%25")[:2500])

          # 4. Inspect GnulaHD logo & favicon PNG dimensions and colors
          logos = []
          for u in [
              "https://ww3.gnulahd.nu/wp-content/themes/dramastream-child/img/logo-gnula.png?v=1782785985",
              "https://ww3.gnulahd.nu/wp-content/uploads/2026/07/cropped-favicon-32x32-2-192x192.png",
              "https://i2.wp.com/ww3.gnulahd.nu/wp-content/uploads/2026/07/cropped-favicon-32x32-2-192x192.png",
          ]:
              ri = S.get(u, timeout=15)
              im = Image.open(io.BytesIO(ri.content))
              logos.append(f"{u}=>{ri.status_code} {im.format} {im.mode} {im.size} bytes={len(ri.content)}")
          print("::notice::LOGOS=" + " || ".join(logos).replace("%", "%25"))
          PY
