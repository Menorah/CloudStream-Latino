name: Probe GnulaHD Final Details
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/probe-gnulahd.yml']
permissions:
  contents: read
jobs:
  grab_ep_html_and_icon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q beautifulsoup4 requests pillow
      - name: Extraer HTML completo de gnrd-epc, search HTML pag, y favicon/logo PNG
        run: |
          python3 - <<'PY'
          import base64, io, re, requests
          from bs4 import BeautifulSoup
          from PIL import Image

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36"
          S = requests.Session()
          S.headers.update({"User-Agent": UA, "Referer": "https://ww3.gnulahd.nu/"})

          # 1. Full inner HTML of a.gnrd-epc on Crown, Bleach, OnePiece
          eps = []
          for u in [
              "https://ww3.gnulahd.nu/ver/the-crown/",
              "https://ww3.gnulahd.nu/ver/bleach-2004/",
              "https://ww3.gnulahd.nu/ver/one-piece-1999/",
          ]:
              sp = BeautifulSoup(S.get(u, timeout=20).text, "html.parser")
              for el in sp.select("svg"): el.decompose()
              all_ep = sp.select("a.gnrd-epc")
              eps.append(f"[{u.split('/ver/')[-1]}] first={re.sub(r'\\s+',' ',str(all_ep[0]))} || last={re.sub(r'\\s+',' ',str(all_ep[-1]))}")
          print("::notice::EP_FULL_HTML=" + " || ".join(eps).replace("%", "%25")[:3500])

          # 2. Check Anime page card badges & Peliculas year dropdown & Search ?s=love page 2 vs 3 vs 4
          sp_a = BeautifulSoup(S.get("https://ww3.gnulahd.nu/ver/anime/", timeout=20).text, "html.parser")
          anime_cards = [(c.get("title"), c.get("href"), [s.get_text(strip=True) for s in c.select(".gnrd-type-badge, .gnrd-qbadge, .gnrd-lang")]) for c in sp_a.select("a.gnrd-card")[:8]]
          sp_p = BeautifulSoup(S.get("https://ww3.gnulahd.nu/ver/peliculas/", timeout=20).text, "html.parser")
          years = [a.get("href") for a in sp_p.select(".gnrd-dd--year a.gnrd-dd-opt")]
          s_pags = []
          for pg in [1, 2, 3, 4]:
              su = f"https://ww3.gnulahd.nu/?s=love" if pg == 1 else f"https://ww3.gnulahd.nu/page/{pg}/?s=love"
              rs = S.get(su, timeout=20)
              sps = BeautifulSoup(rs.text, "html.parser")
              cards = [c.get("href","").split("/ver/")[-1] for c in sps.select("a.gnrd-card")]
              p_els = [re.sub(r'\s+', ' ', str(el))[:300] for el in sps.select(".gnrd-more-wrap, .gnrd-pag, .pagination, .nav-links")]
              s_pags.append(f"p{pg}:status={rs.status_code},cnt={len(cards)},first={cards[:2]},p_els={p_els}")
          print("::notice::ANIME_YEARS_SEARCH=" + f"anime={anime_cards} || years={years[:15]} || search={s_pags}".replace("%", "%25")[:3500])

          # 3. Fetch official GnulaHD favicon (192x192) & logo-gnula.png -> re-save optimized RGBA PNG & emit base64!
          rf = S.get("https://ww3.gnulahd.nu/wp-content/uploads/2026/07/cropped-favicon-32x32-2-192x192.png", timeout=15)
          im = Image.open(io.BytesIO(rf.content)).convert("RGBA")
          # Check if upscaling to 256x256 or keeping 192x192 is smaller
          buf = io.BytesIO()
          im.save(buf, format="PNG", optimize=True)
          b64 = base64.b64encode(buf.getvalue()).decode("ascii")
          print(f"::notice::FAV_LEN={len(buf.getvalue())} B64_LEN={len(b64)}")
          for i in range(0, len(b64), 3200):
              print(f"::notice::FAV_B64_{i//3200}=" + b64[i:i+3200])
          PY
