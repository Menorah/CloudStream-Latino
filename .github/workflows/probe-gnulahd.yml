name: Probe GnulaHD Player JS Functions
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/probe-gnulahd.yml']
permissions:
  contents: read
jobs:
  inspect_js:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Extraer gnrdOpenPlayer y gnpvLoad
        run: |
          python3 - <<'PY'
          import re, requests
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36"
          S = requests.Session()
          S.headers.update({"User-Agent": UA, "Accept-Language": "es-419,es;q=0.9"})
          def one(s): return re.sub(r"\s+", " ", s or "").strip()

          mhtml = S.get("https://ww3.gnulahd.nu/ver/the-jlo-show/", timeout=15).text
          ehtml = S.get("https://ww3.gnulahd.nu/the-crown-6x10/", timeout=15).text
          for label, html, pat in [
              ("MOVIE_JS", mhtml, r"(?:function\s+gnrdOpenPlayer|gnrd/v1/player|GNRD_|_gnrd|gnpv)[\s\S]{0,1200}"),
              ("EP_JS", ehtml, r"(?:function\s+gnpvLoad|gnrd/v1/player|gnep-player-box|GNEP_)[\s\S]{0,1200}"),
          ]:
              matches = [one(m.group(0))[:900] for m in re.finditer(pat, html)][:3]
              for idx, txt in enumerate(matches):
                  print(f"::notice::{label}_{idx}={txt}")
          PY
