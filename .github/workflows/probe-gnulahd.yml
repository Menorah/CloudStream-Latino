name: Probe GnulaHD Player JS Vars
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/probe-gnulahd.yml']
permissions:
  contents: read
jobs:
  inspect_vars:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Extraer _gnrdPid y _gnrdTok en película y episodio
        run: |
          python3 - <<'PY'
          import re, requests
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36"
          S = requests.Session()
          S.headers.update({"User-Agent": UA, "Accept-Language": "es-419,es;q=0.9"})
          def one(s): return re.sub(r"\s+", " ", s or "").strip()

          for label, u in [
              ("MOVIE", "https://ww3.gnulahd.nu/ver/the-jlo-show/"),
              ("EP", "https://ww3.gnulahd.nu/the-crown-6x10/"),
          ]:
              html = S.get(u, timeout=15).text
              idx = html.find("gnrd/v1/player")
              snippet = one(html[max(0, idx - 1200):idx + 200]) if idx != -1 else "NOT_FOUND"
              print(f"::notice::{label}_CTX={snippet[:1400]}")
          PY
