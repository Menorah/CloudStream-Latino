name: Probe GnulaHD EpCard and Icon
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/probe-gnulahd.yml']
permissions:
  contents: read
jobs:
  ep_and_icon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q beautifulsoup4 requests pillow
      - name: Extraer inner HTML de gnrd-epc y PNG del favicon/logo
        run: |
          python3 - <<'PY'
          import base64, io, requests
          from bs4 import BeautifulSoup
          from PIL import Image

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36"
          S = requests.Session()
          S.headers.update({"User-Agent": UA, "Referer": "https://ww3.gnulahd.nu/"})

          eps = []
          for u in [
              "https://ww3.gnulahd.nu/ver/the-crown/",
              "https://ww3.gnulahd.nu/ver/one-piece-1999/",
          ]:
              sp = BeautifulSoup(S.get(u, timeout=20).text, "html.parser")
              for el in sp.select("svg"): el.decompose()
              all_ep = sp.select("a.gnrd-epc")
              s_first = " ".join(str(all_ep[0]).split())
              s_last = " ".join(str(all_ep[-1]).split())
              eps.append(f"[{u.split('/ver/')[-1]}] first={s_first} || last={s_last}")
          print("::notice::EP_CARD_HTML=" + " || ".join(eps).replace("%", "%25")[:3500])

          # Fetch BOTH cropped-favicon-32x32-2-192x192.png and logo-gnula.png
          for tag, img_u in [
              ("FAV", "https://ww3.gnulahd.nu/wp-content/uploads/2026/07/cropped-favicon-32x32-2-192x192.png"),
              ("LOGO", "https://ww3.gnulahd.nu/wp-content/themes/dramastream-child/img/logo-gnula.png?v=1782785985"),
          ]:
              r = S.get(img_u, timeout=20)
              print("IMG", tag, r.status_code, r.headers.get("Content-Type"), len(r.content))
              if r.status_code == 200 and "image" in r.headers.get("Content-Type", ""):
                  im = Image.open(io.BytesIO(r.content)).convert("RGBA")
                  buf = io.BytesIO()
                  im.save(buf, format="PNG", optimize=True)
                  b64 = base64.b64encode(buf.getvalue()).decode("ascii")
                  print(f"::notice::{tag}_INFO=size={im.size} bytes={len(buf.getvalue())} b64len={len(b64)}")
                  # Split across max 4 notices per image
                  if tag == "LOGO":
                      print("::notice::LOGO_B64=" + b64)
                  else:
                      # If > 12KB b64, resize smoothly to 128x128 or chunk into 4-5 notices (we have 10 limit)
                      step = 3500
                      for idx in range(0, len(b64), step):
                          if idx // step < 7:
                              print(f"::notice::FAV_B64_{idx//step}=" + b64[idx:idx+step])
          PY
