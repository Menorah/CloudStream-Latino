name: Probe Icons RePelisHD
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/probe-icons-okhttp.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -q pillow requests curl_cffi
      - name: Inspeccionar RePelisHD y fuentes de íconos
        run: |
          python3 - <<'PY'
          import io, requests
          from collections import Counter
          from PIL import Image
          from curl_cffi import requests as cfreq

          lines = []
          for sz in [16, 32, 64, 128, 256]:
              u = f"https://www.google.com/s2/favicons?domain=repelishd.hair&sz={sz}"
              r = requests.get(u, timeout=10)
              im = Image.open(io.BytesIO(r.content))
              rgba = im.convert("RGBA")
              top_colors = Counter(rgba.getdata()).most_common(4)
              top_hex = [(f"#{c[0]:02x}{c[1]:02x}{c[2]:02x}a{c[3]:02x}", n) for c, n in top_colors]
              lines.append(f"sz={sz}=>{r.status_code} redir={r.url[:65]} size={im.size} {len(r.content)}B colors={top_hex}")
          print("::notice::REPELIS_G=" + " || ".join(lines).replace("%", "%25"))

          # Check Wayback / CDX / other domains / apple-touch.png
          cands = [
              ("repelishd_hair_apple", "https://repelishd.hair/brand/repelishd/apple-touch.png"),
              ("repelishd_hair_fav", "https://repelishd.hair/favicon.ico"),
              ("repelishd_hair_logo", "https://repelishd.hair/brand/repelishd/logo.png"),
              ("repelishd_surf_apple", "https://repelishd.surf/brand/repelishd/apple-touch.png"),
              ("repelishd_lat_apple", "https://repelishd.lat/brand/repelishd/apple-touch.png"),
              ("repelishd_co_apple", "https://repelishd.co/brand/repelishd/apple-touch.png"),
              ("repelishd_one_apple", "https://repelishd.one/brand/repelishd/apple-touch.png"),
              ("repelishd_com_apple", "https://repelishd.com/brand/repelishd/apple-touch.png"),
              ("wayback_apple", "https://web.archive.org/web/2026id_/https://repelishd.hair/brand/repelishd/apple-touch.png"),
          ]
          res_c = []
          for label, u in cands:
              try:
                  r = cfreq.get(u, impersonate="chrome131", timeout=12)
                  ct = r.headers.get("Content-Type", "").split(";")[0]
                  extra = ""
                  if r.status_code == 200 and ct.startswith("image/"):
                      im = Image.open(io.BytesIO(r.content))
                      extra = f" {im.format} {im.size}"
                  res_c.append(f"{label}:{r.status_code}({ct},{len(r.content)}B{extra})")
              except Exception as e:
                  res_c.append(f"{label}:ERR({str(e)[:40]})")
          print("::notice::REPELIS_CANDS=" + " | ".join(res_c).replace("%", "%25"))

          # Check CDX for repelishd.hair images
          try:
              cdx = requests.get("https://web.archive.org/cdx/search/cdx?url=repelishd.hair/brand/*&output=json&limit=10", timeout=15)
              print("::notice::CDX_BRAND=" + cdx.text[:1500].replace("%", "%25"))
          except Exception as e:
              print("::notice::CDX_ERR=" + str(e)[:200])

          # Also check PelisJuanita favicon.png vs apple-touch-icon.png vs logo-juanita.png, and Latanime logito.png top colors
          for label, u in [
              ("Latanime_logito", "https://latanime.org/img/logito.png"),
              ("PelisJuanita_fav", "https://pelisjuanita.com/favicon.png"),
              ("PelisJuanita_apple", "https://pelisjuanita.com/apple-touch-icon.png"),
              ("AnimeOnline_ver2", "https://ver2.animeonline.ninja/fh_assets/apple-touch-icon.png"),
          ]:
              r = cfreq.get(u, impersonate="chrome131", timeout=15)
              im = Image.open(io.BytesIO(r.content))
              rgba = im.convert("RGBA")
              top = [(f"#{c[0]:02x}{c[1]:02x}{c[2]:02x}a{c[3]:02x}", n) for c, n in Counter(rgba.getdata()).most_common(4)]
              print(f"::notice::DETAIL_{label}={r.status_code} {im.format} {im.mode} {im.size} {len(r.content)}B top={top}".replace("%", "%25"))
          PY
