name: Probe AnimeOnline Icon
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/probe-icons-okhttp.yml']
permissions:
  contents: read
jobs:
  fetch_aon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests curl_cffi pillow
      - name: Descargar AnimeOnline icon desde Yandex y Google
        run: |
          python3 - <<'PY'
          import base64, io, requests
          from PIL import Image
          from curl_cffi import requests as cfreq

          # Try ver2 direct first, plus Google and Yandex
          candidates = [
              ("AONVER", lambda: cfreq.get("https://ver2.animeonline.ninja/fh_assets/apple-touch-icon.png", impersonate="chrome131", timeout=12)),
              ("AONG", lambda: requests.get("https://www.google.com/s2/favicons?domain=animeonline.ninja&sz=256", timeout=12)),
              ("AONYAN", lambda: requests.get("https://favicon.yandex.net/favicon/animeonline.ninja?size=120", timeout=12)),
          ]
          for tag, fn in candidates:
              try:
                  r = fn()
                  ct = r.headers.get("Content-Type", "")
                  if r.status_code == 200 and (ct.startswith("image/") or r.content.startswith(b"\x89PNG") or r.content.startswith(b"\xff\xd8")):
                      im = Image.open(io.BytesIO(r.content)).convert("RGBA")
                      buf = io.BytesIO()
                      im.save(buf, format="PNG", optimize=True)
                      raw = buf.getvalue()
                      b64 = base64.b64encode(raw).decode()
                      open(f"/tmp/{tag}.b64", "w").write(b64)
                      print(f"{tag}: {im.size} {len(raw)}B b64={len(b64)}")
                  else:
                      print(f"{tag}: HTTP {r.status_code} {ct}")
              except Exception as e:
                  print(f"{tag}: ERR {e}")
          PY
      - name: Emitir AONG y AONYAN p1
        run: |
          python3 - <<'PY'
          import os
          for tag in ["AONG", "AONYAN", "AONVER"]:
              p = f"/tmp/{tag}.b64"
              if not os.path.exists(p): continue
              b64 = open(p).read()
              parts = [b64[i:i+3500] for i in range(0, len(b64), 3500)]
              if tag != "AONVER":
                  for i, part in enumerate(parts):
                      print(f"::notice::{tag}_{i:02d}_{len(parts):02d}:{part}")
          PY
      - name: Emitir AONVER si existe
        run: |
          python3 - <<'PY'
          import os
          p = "/tmp/AONVER.b64"
          if os.path.exists(p):
              b64 = open(p).read()
              parts = [b64[i:i+3500] for i in range(0, len(b64), 3500)]
              for i in range(0, min(9, len(parts))):
                  print(f"::notice::AONVER_{i:02d}_{len(parts):02d}:{parts[i]}")
          PY
      - name: Emitir AONVER p2 si existe
        run: |
          python3 - <<'PY'
          import os
          p = "/tmp/AONVER.b64"
          if os.path.exists(p):
              b64 = open(p).read()
              parts = [b64[i:i+3500] for i in range(0, len(b64), 3500)]
              for i in range(9, len(parts)):
                  print(f"::notice::AONVER_{i:02d}_{len(parts):02d}:{parts[i]}")
          PY
