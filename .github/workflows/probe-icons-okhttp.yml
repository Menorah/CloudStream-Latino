name: Verify New Icons OkHttp
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/probe-icons-okhttp.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar los 4 nuevos íconos vía OkHttp en raw.githubusercontent.com
        run: |
          mkdir -p /tmp/okhttp
          curl -fsSL -o /tmp/okhttp/okhttp.jar https://repo1.maven.org/maven2/com/squareup/okhttp3/okhttp/4.12.0/okhttp-4.12.0.jar
          curl -fsSL -o /tmp/okhttp/okio.jar https://repo1.maven.org/maven2/com/squareup/okio/okio/3.6.0/okio-3.6.0.jar
          curl -fsSL -o /tmp/okhttp/okio-jvm.jar https://repo1.maven.org/maven2/com/squareup/okio/okio-jvm/3.6.0/okio-jvm-3.6.0.jar
          curl -fsSL -o /tmp/okhttp/kotlin-stdlib.jar https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/1.9.22/kotlin-stdlib-1.9.22.jar
          cat > /tmp/okhttp/VerifyOkHttp.java <<'JAVA'
          import okhttp3.*;
          import javax.imageio.ImageIO;
          import java.awt.image.BufferedImage;
          import java.io.*;
          import java.util.concurrent.TimeUnit;

          public class VerifyOkHttp {
              static final String CS_UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36";

              static void check(OkHttpClient client, String name, String url, String ua) throws Exception {
                  Request.Builder rb = new Request.Builder().url(url);
                  if (ua != null) rb.header("User-Agent", ua);
                  try (Response resp = client.newCall(rb.build()).execute()) {
                      int code = resp.code();
                      String ct = resp.header("Content-Type", "");
                      byte[] body = resp.body() != null ? resp.body().bytes() : new byte[0];
                      BufferedImage img = ImageIO.read(new ByteArrayInputStream(body));
                      if (code != 200 || !ct.startsWith("image/") || img == null) {
                          throw new AssertionError("Failed " + name + " ua=" + ua + " code=" + code + " ct=" + ct + " len=" + body.length);
                      }
                      System.out.println("::notice::OK[" + name + "|" + (ua == null ? "BARE" : "CS_UA") + "] code=" + code + " ct=" + ct + " len=" + body.length + " " + img.getWidth() + "x" + img.getHeight());
                  }
              }

              public static void main(String[] args) throws Exception {
                  OkHttpClient client = new OkHttpClient.Builder()
                      .connectTimeout(15, TimeUnit.SECONDS)
                      .readTimeout(15, TimeUnit.SECONDS)
                      .build();
                  for (String line : args) {
                      int idx = line.indexOf('|');
                      String name = line.substring(0, idx);
                      String url = line.substring(idx + 1);
                      check(client, name, url, null);
                      check(client, name, url, CS_UA);
                  }
              }
          }
          JAVA
          javac -cp "/tmp/okhttp/*" /tmp/okhttp/VerifyOkHttp.java
          BRANCH="arena/5ed72362-cloudstream-latino"
          java -cp "/tmp/okhttp:/tmp/okhttp/*" VerifyOkHttp \
            "Latanime|https://raw.githubusercontent.com/Menorah/CloudStream-Latino/$BRANCH/assets/icons/latanime.png" \
            "PelisJuanita|https://raw.githubusercontent.com/Menorah/CloudStream-Latino/$BRANCH/assets/icons/pelisjuanita.png" \
            "RePelisHD|https://raw.githubusercontent.com/Menorah/CloudStream-Latino/$BRANCH/assets/icons/repelishd.png" \
            "AnimeOnlineNinja|https://raw.githubusercontent.com/Menorah/CloudStream-Latino/$BRANCH/assets/icons/animeonlineninja.png"
