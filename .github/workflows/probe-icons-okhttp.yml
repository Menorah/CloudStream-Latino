name: Probe AnimeOnline Icon
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/probe-icons-okhttp.yml']
permissions:
  contents: read
jobs:
  fetch_aon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests curl_cffi pillow
      - name: Descargar AnimeOnline icon original o Yandex/Google
        run: |
          python3 - <<'PY'
          import base64, io, time, requests
          from PIL import Image
          from curl_cffi import requests as cfreq

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36"
          raw = None
          src = None
          for attempt in range(4):
              for label, fn in [
                  ("ver2_cf", lambda: cfreq.get("https://ver2.animeonline.ninja/fh_assets/apple-touch-icon.png", impersonate="chrome131", timeout=12)),
                  ("ver2_req", lambda: requests.get("https://ver2.animeonline.ninja/fh_assets/apple-touch-icon.png", headers={"User-Agent": UA}, timeout=12)),
              ]:
                  try:
                      r = fn()
                      if r.status_code == 200 and r.content.startswith(b"\x89PNG"):
                          raw = r.content
                          src = label
                          break
                  except Exception:
                      pass
              if raw:
                  break
              time.sleep(2)
          if not raw:
              r = requests.get("https://favicon.yandex.net/favicon/animeonline.ninja?size=120", timeout=12)
              if r.status_code == 200 and r.content.startswith(b"\x89PNG"):
                  raw = r.content
                  src = "yandex_120"
          assert raw is not None
          im = Image.open(io.BytesIO(raw))
          print(f"::notice::AON_SRC={src} size={im.size} len={len(raw)}")
          b64 = base64.b64encode(raw).decode()
          open("/tmp/AON.b64", "w").write(b64)
          PY
      - name: Emitir p1
        run: |
          python3 - <<'PY'
          b64 = open("/tmp/AON.b64").read()
          parts = [b64[i:i+3500] for i in range(0, len(b64), 3500)]
          for i in range(0, min(8, len(parts))):
              print(f"::notice::AON_{i:02d}_{len(parts):02d}:{parts[i]}")
          PY
      - name: Emitir p2
        run: |
          python3 - <<'PY'
          b64 = open("/tmp/AON.b64").read()
          parts = [b64[i:i+3500] for i in range(0, len(b64), 3500)]
          for i in range(8, min(16, len(parts))):
              print(f"::notice::AON_{i:02d}_{len(parts):02d}:{parts[i]}")
          PY
      - name: Emitir p3
        run: |
          python3 - <<'PY'
          b64 = open("/tmp/AON.b64").read()
          parts = [b64[i:i+3500] for i in range(0, len(b64), 3500)]
          for i in range(16, min(24, len(parts))):
              print(f"::notice::AON_{i:02d}_{len(parts):02d}:{parts[i]}")
          PY
      - name: Emitir p4
        run: |
          python3 - <<'PY'
          b64 = open("/tmp/AON.b64").read()
          parts = [b64[i:i+3500] for i in range(0, len(b64), 3500)]
          for i in range(24, min(32, len(parts))):
              print(f"::notice::AON_{i:02d}_{len(parts):02d}:{parts[i]}")
          PY
