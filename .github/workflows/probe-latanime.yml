name: Probe Latanime
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/probe-latanime.yml', 'Latanime/**']
permissions:
  contents: read
  checks: write
jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Latanime unit + live tests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          LATANIME_LIVE: 'true'
        run: |
          set +e
          LATANIME_LIVE=true ./gradlew :Latanime:testDebugUnitTest --info --rerun-tasks > gradle-live.txt 2>&1
          status=$?
          export STATUS=$status
          python3 - <<'PY'
          import os, pathlib, requests, xml.etree.ElementTree as ET
          log = pathlib.Path('gradle-live.txt').read_text(errors='replace')
          live_lines = [s for s in log.splitlines() if 'LIVE_' in s or 'FAILED' in s or 'e: ' in s or 'Error' in s or 'Exception' in s]
          xml_summary = []
          for p in sorted(pathlib.Path('Latanime').glob('build/test-results/testDebugUnitTest/TEST-*.xml')):
              root = ET.parse(p).getroot()
              xml_summary.append(f"{p.name}: tests={root.get('tests')} failures={root.get('failures')} errors={root.get('errors')} skipped={root.get('skipped')}")
              for tc in root.findall('testcase'):
                  for fail in tc.findall('failure') + tc.findall('error'):
                      xml_summary.append(f"  FAIL {tc.get('classname')}.{tc.get('name')}: {fail.get('message')}\n{(fail.text or '')[:1500]}")
          text = "\n".join(xml_summary) + "\n\n--- LIVE & ERROR LOGS ---\n" + "\n".join(live_lines[:150]) + "\n\n--- LOG TAIL ---\n" + log[-15000:]
          requests.post(
              f"https://api.github.com/repos/{os.environ['REPO']}/check-runs",
              json={
                  "name": "latanime-live-suite",
                  "head_sha": os.environ["SHA"],
                  "status": "completed",
                  "conclusion": "success" if int(os.environ.get("STATUS", "1")) == 0 else "failure",
                  "output": {
                      "title": f"Latanime unit+live tests (exit={os.environ.get('STATUS')})",
                      "summary": "\n".join(xml_summary)[:60000] or "See text",
                      "text": text[:60000],
                  },
              },
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"},
              timeout=30,
          )
          PY
          exit "$status"
