name: Probe Pelis182 Final Details
on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - '.github/workflows/probe-pelis182.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Setup deps
        shell: bash
        run: python3 -m pip install -q beautifulsoup4

      - name: Verify 9bg.net sub-playlist, segments, juicycodes, and multi-season search
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, re
          from bs4 import BeautifulSoup

          def notice(tag, msg):
              s = f"[{tag}] " + msg
              s = s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print("::notice::" + s[:3800])

          def fetch_raw(url, headers=None):
              hdrs = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"}
              if headers:
                  hdrs.update(headers)
              req = urllib.request.Request(url, headers=hdrs)
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, dict(r.headers), r.read()
              except Exception as e:
                  return getattr(e, 'code', -1), {}, str(e).encode()

          # 1. Inspect Street Fighter & Blade Runner 2099 sub-playlists and segments WITH paulinito referer
          for name, emp in [("SF", "https://paulinito.com/player/f2pHbAiudhy6id3/"), ("BR2099", "https://paulinito.com/player/9kLWLT8pzTnerzx/")]:
              _, _, b = fetch_raw(emp, {"Referer": "https://pelis182.net/"})
              html = b.decode('utf-8', 'replace')
              m_src = re.search(r'"file"\s*:\s*"([^"]+\.m3u8[^"]*)"', html)
              if m_src:
                  master_u = m_src.group(1)
                  st, h, mb = fetch_raw(master_u, {"Referer": "https://paulinito.com/"})
                  mt = mb.decode('utf-8', 'replace')
                  variants = [ln.strip() for ln in mt.splitlines() if ln.strip() and not ln.strip().startswith('#')]
                  notice(f"MASTER_{name}", f"st={st} variants={variants}")
                  if variants:
                      sub_u = urllib.parse.urljoin(master_u, variants[-1])
                      st2, h2, sb = fetch_raw(sub_u, {"Referer": "https://paulinito.com/"})
                      st2_no, _, _ = fetch_raw(sub_u, {})
                      st_t = sb.decode('utf-8', 'replace')
                      seg_lines = [ln.strip() for ln in st_t.splitlines() if ln.strip() and not ln.strip().startswith('#')]
                      notice(f"SUBM3U8_{name}", f"url={sub_u[:120]} st_paul={st2} st_no={st2_no}\n" + "\n".join(st_t.splitlines()[:18]))
                      if seg_lines:
                          seg_u = urllib.parse.urljoin(sub_u, seg_lines[0])
                          st3, h3, segb = fetch_raw(seg_u, {"Referer": "https://paulinito.com/"})
                          st3_no, _, _ = fetch_raw(seg_u, {})
                          notice(f"SEG_{name}", f"url={seg_u[:140]} st_paul={st3} st_no={st3_no} ct={h3.get('Content-Type','')} len={len(segb)} head_hex={segb[:16].hex()}")

          # 2. Check juicycodes.js decoded alphabet
          _, _, jcb = fetch_raw("https://paulinito.com/templates/jwplayer/assets/juicycodes.js", {"Referer": "https://paulinito.com/"})
          jcs = jcb.decode('utf-8', 'replace')
          m_p = re.search(r"return a\}\('(.*)',10,166,'(.*)'\.split\('\|'\),0,\{\}\)\)", jcs, re.S)
          if m_p:
              p, k = m_p.group(1), m_p.group(2).split('|')
              for i in range(len(k)-1, -1, -1):
                  if k[i]:
                      p = re.sub(r'\b'+str(i)+r'\b', k[i], p)
              notice("JC_DECODED", p.encode('utf-8').decode('unicode_escape')[:3500])

          # 3. Check search results for Black Mirror, The Boys, Blade Runner, and anime page badges
          for q in ["Black Mirror", "The Boys", "Street Fighter"]:
              su = "https://pelis182.net/?s=" + urllib.parse.quote_plus(q)
              st, _, hb = fetch_raw(su)
              s = BeautifulSoup(hb.decode('utf-8', 'replace'), 'html.parser')
              cards = [(c.select_one('h3').get_text(strip=True) if c.select_one('h3') else '', (c.select_one('.p182-card__badge') or {}).get_text(strip=True) if c.select_one('.p182-card__badge') else '', c.select_one('a[href]')['href'] if c.select_one('a[href]') else '') for c in s.select('article.p182-card')]
              notice(f"SEARCH_{q}", f"st={st} count={len(cards)} cards={cards[:15]}")

          # 4. Inspect hero section, anime cards, and detail facts/cast/json-ld on Street Fighter & Blade Runner 2099 & Black Mirror T7
          _, _, hb_home = fetch_raw("https://pelis182.net/")
          sh = BeautifulSoup(hb_home.decode('utf-8', 'replace'), 'html.parser')
          hero = sh.select('.p182-stage [data-hero-slide], .p182-stage a[href]')
          notice("HERO_HTML", "\n".join(str(x)[:350] for x in hero[:6]))

          _, _, hb_an = fetch_raw("https://pelis182.net/category/anime/")
          sa = BeautifulSoup(hb_an.decode('utf-8', 'replace'), 'html.parser')
          an_cards = [(c.select_one('h3').get_text(strip=True) if c.select_one('h3') else '', (c.select_one('.p182-card__badge') or {}).get_text(strip=True) if c.select_one('.p182-card__badge') else '', [sp.get_text(strip=True) for sp in c.select('.p182-card__meta span')]) for c in sa.select('article.p182-card')]
          notice("ANIME_CARDS", f"count={len(an_cards)} cards={an_cards[:15]}")

          for du in ["https://pelis182.net/street-fighter/", "https://pelis182.net/black-mirror-temporada-7/", "https://pelis182.net/el-ultimo-gran-golpe/"]:
              _, _, db = fetch_raw(du)
              sd = BeautifulSoup(db.decode('utf-8', 'replace'), 'html.parser')
              watch = sd.select_one('article.watch-page')
              lds = [sc.get_text(strip=True) for sc in sd.select('script[type="application/ld+json"]')]
              facts = str(sd.select_one('.entry-facts'))[:600] if sd.select_one('.entry-facts') else ''
              wmeta = str(sd.select_one('.watch-meta'))[:500] if sd.select_one('.watch-meta') else ''
              srv_rows = str(sd.select_one('.server-rows') or sd.select_one('.server-row'))[:700] if (sd.select_one('.server-rows') or sd.select_one('.server-row')) else ''
              trailer_iframes = [f.get('src') or f.get('data-src') for f in sd.select('iframe') if 'youtube' in (f.get('src') or f.get('data-src') or '').lower()]
              yt_links = [a['href'] for a in sd.select('a[href*="youtu"]')]
              notice(f"DETAIL_{du.strip('/').split('/')[-1]}", f"wmeta={wmeta}\nfacts={facts}\nsrv_rows={srv_rows}\ntrailers={trailer_iframes + yt_links}\nlds={lds}")
          PY
