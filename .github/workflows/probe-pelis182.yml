name: Probe Pelis182 Deep
on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - '.github/workflows/probe-pelis182.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Setup and unpack zip
        shell: bash
        run: |
          python3 -m pip install -q beautifulsoup4 pillow
          mkdir -p /tmp/pelis182_zip
          curl -fsSL -A "Mozilla/5.0" "https://tmpfiles.org/dl/1795826677.9fd718905ea26ff7/wBAlvykFhc8v/pelis182.net.zip" -o /tmp/pelis182.zip || {
            PAGE=$(curl -fsSL -A "Mozilla/5.0" "https://tmpfiles.org/wBAlvykFhc8v/pelis182.net.zip")
            DL=$(python3 -c 'import re,sys; m=re.search(r"https://tmpfiles\.org/dl/[^\"\x27<> ]+\.zip", sys.stdin.read()); print(m.group(0) if m else "")' <<< "$PAGE")
            curl -fsSL -A "Mozilla/5.0" "$DL" -o /tmp/pelis182.zip
          }
          unzip -q -o /tmp/pelis182.zip -d /tmp/pelis182_zip

      - name: Deep 1 - Home sections, Catalog filters, Anime, Pagination
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, urllib.request
          from bs4 import BeautifulSoup

          def notice(tag, msg):
              s = f"[{tag}] " + msg
              s = s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print("::notice::" + s[:3800])

          root = pathlib.Path('/tmp/pelis182_zip')
          # 1. Full Home structure
          home = next(root.rglob('Películas y Series Online – Pelis182.html'))
          hs = BeautifulSoup(home.read_text(errors='replace'), 'html.parser')
          secs = []
          for el in hs.select('header, main > *'):
              tag = el.name
              cls = " ".join(el.get('class', []))
              eid = el.get('id', '')
              h2 = el.select_one('h1,h2')
              h2t = h2.get_text(' ', strip=True) if h2 else ''
              cards = el.select('article.p182-card')
              sample_badges = sorted({b.get_text(strip=True) for c in cards for b in c.select('span[class*=badge], .p182-card__image span') if '▶' not in b.get_text()})
              more_links = [(a.get('href'), a.get_text(' ', strip=True)) for a in el.select('a.button, .section-heading a, header a')]
              secs.append(f"<{tag} id='{eid}' class='{cls}'> h={h2t} cards={len(cards)} badges={sample_badges} links={more_links[:6]}")
              if cards:
                  secs.append("  SAMPLE_CARD=" + str(cards[0])[:650])
                  for c in cards:
                      if c.select('.p182-card__badge, [class*=badge]') or 'SERIE' in c.get_text():
                          secs.append("  BADGED_CARD=" + str(c)[:650])
                          break
          notice("HOME_SECS", "\n".join(secs)[:3600])
          if len("\n".join(secs)) > 3600:
              notice("HOME_SECS_2", "\n".join(secs)[3600:7200])

          # 2. Full Catalog page HTML filters + forms
          cat = next(root.rglob('Películas online_ catálogo completo _ Pelis182.html'))
          cs = BeautifulSoup(cat.read_text(errors='replace'), 'html.parser')
          cat_main = cs.select_one('main, #main-content')
          cat_header = "\n".join(str(el) for el in cat_main.select('header, nav, form, select, .catalog-filters, .catalog-toolbar, [class*=filter], [class*=sort], .pagination'))
          notice("CATALOG_UI", cat_header[:3600])
          if len(cat_header) > 3600:
              notice("CATALOG_UI_2", cat_header[3600:7200])

          # 3. Search page with query params and ?tipo=...
          for tag, url in [
              ("ANIME_CAT", "https://pelis182.net/category/anime/"),
              ("CATALOG_SORT", "https://pelis182.net/catalogo/?orden=tendencias"),
              ("SEARCH_EMPTY", "https://pelis182.net/?s=zzzzzzzzzz"),
              ("SEARCH_MULTI", "https://pelis182.net/?s=el"),
          ]:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  html = urllib.request.urlopen(req, timeout=15).read().decode('utf-8', 'replace')
                  s = BeautifulSoup(html, 'html.parser')
                  cards = s.select('article.p182-card')
                  sample = str(cards[0])[:500] if cards else 'NO_CARDS'
                  pag = str(s.select_one('.pagination'))[:400] if s.select_one('.pagination') else 'NO_PAG'
                  notice(tag, f"cards={len(cards)} h1={s.select_one('h1').get_text(' ', strip=True) if s.select_one('h1') else ''}\nSAMPLE={sample}\nPAG={pag}")
              except Exception as e:
                  notice(tag, f"ERR {e}")
          PY

      - name: Deep 2 - Series The Boys DOM, saved_resource.html, juicycodes.js, entry.js, main.js
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          from bs4 import BeautifulSoup

          def notice(tag, msg):
              s = f"[{tag}] " + msg
              s = s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print("::notice::" + s[:3800])

          root = pathlib.Path('/tmp/pelis182_zip')
          # 1. Full watch-page sections for The Boys
          boys = next(root.rglob('The Boys - Temporada 5 (2026) online – Pelis182.html'))
          bs = BeautifulSoup(boys.read_text(errors='replace'), 'html.parser')
          bm = bs.select_one('article.watch-page')
          bm_txt = str(bm)
          notice("BOYS_1", bm_txt[:3600])
          notice("BOYS_2", bm_txt[3600:7200])
          notice("BOYS_3", bm_txt[7200:10800])

          # 2. All saved_resource.html files!
          for idx, sr in enumerate(sorted(root.rglob('saved_resource.html'))):
              txt = sr.read_text(errors='replace')
              notice(f"SAVED_RES_{idx}", f"{sr.relative_to(root)} ({len(txt)}B)\n" + txt[:3400])

          # 3. Inspect juicycodes.js, entry.js, smg-front.js, uvpi.js
          for idx, pat in enumerate(['*juicycodes*', '*entry.js*', '*uvpi.js*', '*smg-front.js*']):
              matches = sorted(root.rglob(pat))
              if matches:
                  f = matches[0]
                  t = f.read_text(errors='replace')
                  notice(f"JS_{f.name}", f"({len(t)}B)\n" + t[:3400])
          PY

      - name: Deep 3 - Live paulinito.com player reverse engineering and host inventory
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, re, json
          from bs4 import BeautifulSoup

          def notice(tag, msg):
              s = f"[{tag}] " + msg
              s = s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print("::notice::" + s[:3800])

          def fetch(url, headers=None):
              hdrs = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"}
              if headers:
                  hdrs.update(headers)
              req = urllib.request.Request(url, headers=hdrs)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.status, r.geturl(), dict(r.headers), r.read().decode('utf-8', 'replace')

          # 1. Inspect paulinito.com/player/... HTML + headers (with and without Referer!)
          test_urls = [
              "https://pelis182.net/street-fighter/",
              "https://pelis182.net/blade/",
              "https://pelis182.net/el-ultimo-gran-golpe/",
              "https://pelis182.net/blade-runner-2099-temporada-1/",
              "https://pelis182.net/the-boys-temporada-5/",
              "https://pelis182.net/black-mirror-temporada-7/",
              "https://pelis182.net/los-simpson-santa-homero/",
          ]
          # Also grab first 12 links from home + 6 from /category/anime/
          _, _, _, home_html = fetch("https://pelis182.net/")
          hs = BeautifulSoup(home_html, 'html.parser')
          for a in hs.select('article.p182-card a[href]'):
              u = a['href']
              if u not in test_urls and len(test_urls) < 18:
                  test_urls.append(u)
          try:
              _, _, _, ani_html = fetch("https://pelis182.net/category/anime/")
              asoup = BeautifulSoup(ani_html, 'html.parser')
              for a in asoup.select('article.p182-card a[href]')[:4]:
                  if a['href'] not in test_urls:
                      test_urls.append(a['href'])
          except Exception:
              pass

          embeds = []
          server_summaries = []
          for u in test_urls:
              try:
                  _, _, _, html = fetch(u)
                  s = BeautifulSoup(html, 'html.parser')
                  btns = s.select('[data-iframe]')
                  iframes = [f.get('data-uvpi-src') or f.get('src') for f in s.select('.theater iframe') if (f.get('data-uvpi-src') or f.get('src'))]
                  btn_samples = []
                  for b in btns[:3]:
                      m = re.search(r'src=["\x27]([^"\x27]+)', b.get('data-iframe', ''))
                      src = m.group(1) if m else b.get('data-iframe', '')[:80]
                      btn_samples.append(f"{b.get_text(strip=True)}={src}")
                      if m and m.group(1) not in embeds:
                          embeds.append((u, m.group(1)))
                  for f in iframes:
                      if f not in [e[1] for e in embeds]:
                          embeds.append((u, f))
                  # Also check non-episode server rows!
                  rows = [f"row({r.get('class')}):btns={len(r.select('button'))}" for r in s.select('.server-row')]
                  server_summaries.append(f"{u} => rows={rows} iframes={iframes} btns={len(btns)} {btn_samples[:2]}")
              except Exception as e:
                  server_summaries.append(f"{u} => ERR {e}")
          notice("PAGES_SERVERS", "\n".join(server_summaries)[:3600])

          # 2. Fetch paulinito.com player HTML (first 2 embeds) + all its JS!
          for idx, (ref, emp) in enumerate(embeds[:2]):
              try:
                  st, fu, hdr, html = fetch(emp, {"Referer": ref})
                  notice(f"PAULINITO_{idx}", f"url={emp} final={fu} st={st} len={len(html)}\n" + html[:3400])
                  if len(html) > 3400:
                      notice(f"PAULINITO_{idx}B", html[3400:6800])
              except Exception as e:
                  notice(f"PAULINITO_{idx}_ERR", f"{emp} => {e}")

          # Check if ALL embeds are paulinito.com or other hosts exist!
          hosts = {}
          for ref, emp in embeds:
              h = re.sub(r'^https?://([^/]+).*', r'\1', emp)
              hosts[h] = hosts.get(h, 0) + 1
          notice("EMBED_HOSTS", f"total={len(embeds)} counts={hosts}\nSAMPLE_EMBEDS=\n" + "\n".join(f"{r} -> {e}" for r, e in embeds[:25]))
          PY

      - name: Deep 4 - Live probe paulinito.com JS & stream resolution + Icon PNG bytes
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, re, json, base64, io
          from PIL import Image

          def notice(tag, msg):
              s = f"[{tag}] " + msg
              s = s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print("::notice::" + s[:3800])

          def fetch(url, headers=None, data=None):
              hdrs = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"}
              if headers:
                  hdrs.update(headers)
              req = urllib.request.Request(url, data=data, headers=hdrs)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.status, r.geturl(), dict(r.headers), r.read().decode('utf-8', 'replace')

          # Probe paulinito.com player page from Street Fighter + its entry.js / juicycodes
          for emp in ["https://paulinito.com/player/f2pHbAiudhy6id3/", "https://paulinito.com/player/9kLWLT8pzTnerzx/"]:
              try:
                  st, fu, hdr, html = fetch(emp, {"Referer": "https://pelis182.net/"})
                  scripts = re.findall(r'<script[^>]*src=["\x27]([^"\x27]+)', html, re.I)
                  notice("PAUL_SCRIPTS", f"{emp} => scripts={scripts}\nHTML_HEAD={html[:1200]}")
                  for sc in scripts:
                      sc_url = urllib.parse.urljoin(fu, sc)
                      if any(k in sc_url.lower() for k in ['entry', 'juicy', 'player', 'app', 'main']) and 'jw' not in sc_url.lower():
                          _, _, _, jtxt = fetch(sc_url, {"Referer": fu})
                          notice(f"PAUL_JS_{sc_url.split('/')[-1][:20]}", f"{sc_url} ({len(jtxt)}B)\n" + jtxt[:3400])
                  break
              except Exception as e:
                  notice("PAUL_PROBE_ERR", f"{emp} => {e}")

          # Also export resized 96x96 PNG thumbnail of cropped-p182-192x192.png AND raw 192x192 info
          try:
              raw = urllib.request.urlopen(urllib.request.Request("https://pelis182.net/wp-content/uploads/2026/08/cropped-p182-192x192.png", headers={"User-Agent": "Mozilla/5.0"}), timeout=15).read()
              im = Image.open(io.BytesIO(raw)).convert("RGBA")
              # Preview 96x96 quantized to check cleanly visually!
              prev = im.resize((96, 96), Image.LANCZOS).quantize(colors=64)
              buf = io.BytesIO()
              prev.save(buf, format="PNG", optimize=True)
              b64 = base64.b64encode(buf.getvalue()).decode()
              notice("ICON_192_PREVIEW", f"orig_size={len(raw)} orig_mode={im.mode} orig_dims={im.size} prev_b64_len={len(b64)}\n{b64[:3400]}")
              if len(b64) > 3400:
                  notice("ICON_192_PREVIEW_2", b64[3400:6800])
              # Also check raw PELIS182.png dimensions & bounding box
              raw_logo = urllib.request.urlopen(urllib.request.Request("https://pelis182.net/wp-content/uploads/2024/04/PELIS182.png", headers={"User-Agent": "Mozilla/5.0"}), timeout=15).read()
              iml = Image.open(io.BytesIO(raw_logo)).convert("RGBA")
              notice("LOGO_INFO", f"size={len(raw_logo)} dims={iml.size} bbox={iml.getbbox()}")
          except Exception as e:
              notice("ICON_ERR", repr(e))
          PY
