name: Probe SoloLatino Deep Zip
on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - '.github/workflows/probe-sololatino.yml'
permissions:
  contents: read
jobs:
  job_inventory_and_logo:
    runs-on: ubuntu-latest
    steps:
      - name: Unpack and list all HTMLs, JS, CSS, and logo assets
        shell: bash
        run: |
          python3 -m pip install -q beautifulsoup4 pillow
          python3 - <<'PY'
          import urllib.request, zipfile, pathlib, hashlib, base64, io
          from PIL import Image

          def notice(tag, msg):
              s = f"[{tag}] " + msg
              chunk_size = 3500
              parts = [s[i:i+chunk_size] for i in range(0, len(s), chunk_size)] or [s]
              for idx, part in enumerate(parts):
                  body = part if idx > 0 else part[len(f"[{tag}] "):]
                  out = (f"[{tag}#{idx+1}/{len(parts)}] " + body) if len(parts) > 1 else part
                  out = out.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print("::notice::" + out[:3900])

          zip_url = "https://tmpfiles.org/dl/1795829056.c4d746017bc67456/wLAXvg4SCnBj/sololatino.net.zip"
          req = urllib.request.Request(zip_url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=60) as r:
              pathlib.Path("/tmp/sl.zip").write_bytes(r.read())
          d = pathlib.Path("/tmp/sl_unzip")
          d.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile("/tmp/sl.zip") as zf:
              zf.extractall(d)

          htmls = sorted([f"{p.relative_to(d)} ({p.stat().st_size} B)" for p in d.rglob("*.html") if p.name != "saved_resource.html"])
          notice("ALL_HTMLS", f"count={len(htmls)}\n" + "\n".join(htmls))

          # Also list all non-tmdb images (logos/favicons/banners) inside zip
          other_assets = []
          for p in sorted(d.rglob("*")):
              if not p.is_file():
                  continue
              rel = str(p.relative_to(d))
              if p.name.endswith('.png') or 'logo' in p.name.lower() or 'icon' in p.name.lower():
                  b = p.read_bytes()
                  h = hashlib.sha1(b).hexdigest()[:8]
                  dim = ""
                  try:
                      im = Image.open(io.BytesIO(b))
                      dim = f"{im.size} {im.mode}"
                  except Exception:
                      pass
                  other_assets.append(f"{rel} ({len(b)} B {dim} sha1={h})")
          notice("PNG_AND_LOGO_ASSETS", "\n".join(other_assets[:60]))

          # Check if live logo.png works
          for iu in ["https://sololatino.net/images/logo.png", "https://sololatino.net/favicon.ico"]:
              try:
                  ir = urllib.request.Request(iu, headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"})
                  with urllib.request.urlopen(ir, timeout=15) as r2:
                      ib = r2.read()
                      b64 = base64.b64encode(ib).decode('ascii')
                      notice(f"LIVE_ICON_{pathlib.Path(iu).name}", f"st={r2.status} len={len(ib)} b64={b64}")
              except Exception as e:
                  notice(f"LIVE_ICON_{pathlib.Path(iu).name}", f"err={e}")
          PY

  job_html_catalogs:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Home, Peliculas, Series, Anime, Doramas, Genero, Busqueda HTMLs
        shell: bash
        run: |
          python3 -m pip install -q beautifulsoup4
          python3 - <<'PY'
          import urllib.request, zipfile, pathlib
          from bs4 import BeautifulSoup

          def notice(tag, msg):
              s = f"[{tag}] " + msg
              chunk_size = 3500
              parts = [s[i:i+chunk_size] for i in range(0, len(s), chunk_size)] or [s]
              for idx, part in enumerate(parts):
                  body = part if idx > 0 else part[len(f"[{tag}] "):]
                  out = (f"[{tag}#{idx+1}/{len(parts)}] " + body) if len(parts) > 1 else part
                  out = out.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print("::notice::" + out[:3900])

          zip_url = "https://tmpfiles.org/dl/1795829056.c4d746017bc67456/wLAXvg4SCnBj/sololatino.net.zip"
          with urllib.request.urlopen(urllib.request.Request(zip_url, headers={"User-Agent": "Mozilla/5.0"}), timeout=60) as r:
              pathlib.Path("/tmp/sl.zip").write_bytes(r.read())
          d = pathlib.Path("/tmp/sl_unzip")
          d.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile("/tmp/sl.zip") as zf:
              zf.extractall(d)

          # Analyze home + catalog list pages
          for hp in sorted(d.rglob("*.html")):
              if hp.name == "saved_resource.html":
                  continue
              rel = str(hp.relative_to(d))
              if any(x in rel.lower() for x in ['ejemplo pelicula', 'ejemplo serie', 'ejemplo episodio', '/episodio/', '/pelicula/', '/serie/']):
                  continue
              soup = BeautifulSoup(hp.read_text(encoding='utf-8', errors='replace'), 'html.parser')
              # Extract sections and filter options and navigation platforms/genres
              sections = []
              for sec in soup.select('main section, main > div'):
                  h = sec.select_one('h1, h2, h3')
                  cards = sec.select('.card, article, .ep-card, [class*="episode"]')
                  more = sec.select_one('a[href*="/peliculas"], a[href*="/series"], a[href*="/animes"], a[href*="/doramas"], a[href*="/episodios"], a[href*="/estrenos"]')
                  if h or len(cards) >= 2:
                      sections.append(f"SEC h='{h.get_text(strip=True) if h else ''}' cards={len(cards)} more={more.get('href') if more else None} sample={str(cards[0])[:650] if cards else ''}")
              selects = [(sl.get('name'), [(o.get('value'), o.get_text(strip=True)) for o in sl.select('option')]) for sl in soup.select('select')]
              nav_all = [(a.get_text(strip=True), a.get('href')) for a in soup.select('header a[href], nav a[href], footer a[href]')]
              pags = [str(p)[:600] for p in soup.select('nav.pagination, .pagination')[:2]]
              notice(f"CAT_{hp.name[:25]}", f"rel={rel}\nSECTIONS({len(sections)}):\n" + "\n---\n".join(sections[:10]) + f"\nSELECTS={selects}\nNAV_ALL={nav_all[:45]}\nPAGS={pags}")
          PY

  job_html_details:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect every Detail & Series & Episode HTML in zip
        shell: bash
        run: |
          python3 -m pip install -q beautifulsoup4
          python3 - <<'PY'
          import urllib.request, zipfile, pathlib, re
          from bs4 import BeautifulSoup

          def notice(tag, msg):
              s = f"[{tag}] " + msg
              chunk_size = 3500
              parts = [s[i:i+chunk_size] for i in range(0, len(s), chunk_size)] or [s]
              for idx, part in enumerate(parts):
                  body = part if idx > 0 else part[len(f"[{tag}] "):]
                  out = (f"[{tag}#{idx+1}/{len(parts)}] " + body) if len(parts) > 1 else part
                  out = out.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print("::notice::" + out[:3900])

          zip_url = "https://tmpfiles.org/dl/1795829056.c4d746017bc67456/wLAXvg4SCnBj/sololatino.net.zip"
          with urllib.request.urlopen(urllib.request.Request(zip_url, headers={"User-Agent": "Mozilla/5.0"}), timeout=60) as r:
              pathlib.Path("/tmp/sl.zip").write_bytes(r.read())
          d = pathlib.Path("/tmp/sl_unzip")
          d.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile("/tmp/sl.zip") as zf:
              zf.extractall(d)

          # Analyze ALL remaining HTMLs (and especially anything in peliculas/, series/, or detail pages)
          for hp in sorted(d.rglob("*.html")):
              if hp.name == "saved_resource.html":
                  continue
              rel = str(hp.relative_to(d))
              if rel.startswith("sololatino.net/anime/") or rel.startswith("sololatino.net/doramas/") or rel.startswith("sololatino.net/busqueda ejemplo/") or rel.startswith("sololatino.net/genero ejemplo/") or rel.endswith("/Ver Películas Completas en Español Latino HD — SoloLatino.Net.html"):
                  continue
              raw = hp.read_text(encoding='utf-8', errors='replace')
              soup = BeautifulSoup(raw, 'html.parser')
              main = soup.select_one('main') or soup.body
              # Extract player section, hero/info section, seasons/episodes, cast, related, json-ld, data-* attrs
              player = soup.select_one('#player-section')
              # Get clean player HTML (strip darkreader attrs)
              for el in soup.find_all(True):
                  for k in list(el.attrs):
                      if 'darkreader' in k:
                          del el.attrs[k]
                  if 'style' in el.attrs and 'darkreader' in el.attrs['style']:
                      del el.attrs['style']
              player_html = str(soup.select_one('#player-section')) if soup.select_one('#player-section') else 'NONE'
              main_children = []
              if main:
                  for ch in main.find_all(['section', 'div'], recursive=False):
                      main_children.append(f"<{ch.name} id={ch.get('id')} class={ch.get('class')}> len={len(str(ch))} sample={str(ch)[:750]}")
              lds = [sc.get_text(strip=True)[:1200] for sc in soup.select('script[type="application/ld+json"]')]
              # Also specifically search for season/episode controls, player tokens, lazy embeds, tabs
              ep_els = soup.select('[data-season], [data-episode], [data-tab-btn], [data-tab-panel], a[href*="/episodio"], a[href*="temporada"], #seasons-section, .episode-card, .ep-row, [class*="episod"], [class*="season"]')
              ep_str = "\n".join(str(x)[:500] for x in ep_els[:16])
              # Extract head/hero meta area
              hero = soup.select_one('.hero, .detail-hero, section')
              hero_str = str(hero)[:2500] if hero else ''
              inlines = [sc.get_text() for sc in soup.select('script:not([src])') if any(w in sc.get_text().lower() for w in ['token', 'player', 'episode', 'season', 'trailer', 'sl_', 'api'])]
              notice(f"DET_{hp.name[:25]}", f"rel={rel}\nLDS={lds}\nPLAYER_HTML:\n{player_html[:3200]}\nHERO:\n{hero_str}\nEP_ELEMENTS({len(ep_els)}):\n{ep_str}\nMAIN_BLOCKS:\n" + "\n".join(main_children[:8]) + "\nINLINES:\n" + "\n---\n".join(x[:1200] for x in inlines[:4]))
          PY

  job_js_full:
    runs-on: ubuntu-latest
    steps:
      - name: Extract full app JS logic for player, auth, CSRF, render shield, Embed69, pelisserieshoy
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, zipfile, pathlib, hashlib

          def notice(tag, msg):
              s = f"[{tag}] " + msg
              chunk_size = 3500
              parts = [s[i:i+chunk_size] for i in range(0, len(s), chunk_size)] or [s]
              for idx, part in enumerate(parts):
                  body = part if idx > 0 else part[len(f"[{tag}] "):]
                  out = (f"[{tag}#{idx+1}/{len(parts)}] " + body) if len(parts) > 1 else part
                  out = out.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print("::notice::" + out[:3900])

          zip_url = "https://tmpfiles.org/dl/1795829056.c4d746017bc67456/wLAXvg4SCnBj/sololatino.net.zip"
          with urllib.request.urlopen(urllib.request.Request(zip_url, headers={"User-Agent": "Mozilla/5.0"}), timeout=60) as r:
              pathlib.Path("/tmp/sl.zip").write_bytes(r.read())
          d = pathlib.Path("/tmp/sl_unzip")
          d.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile("/tmp/sl.zip") as zf:
              zf.extractall(d)

          app_js = next(d.rglob("app-*.js.download"))
          txt = app_js.read_text(encoding='utf-8', errors='replace')
          # Emit the custom application tail (offset 35000..end is ~37KB = 11 chunks!)
          notice("APP_JS_HEAD_INFO", f"file={app_js.name} len={len(txt)} first500={txt[:500]}")
          notice("APP_JS_TAIL", txt[34000:])

          # Also inspect one main.js.download to understand what script that is
          main_js = next(d.rglob("main.js.download"))
          mtxt = main_js.read_text(encoding='utf-8', errors='replace')
          notice("MAIN_JS_INFO", f"len={len(mtxt)} head={mtxt[:1500]} tail={mtxt[-1500:]}")
          PY
