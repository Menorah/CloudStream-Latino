name: Diagnóstico de acceso RePelis24.shop
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['scripts/repelis24_shop_access_probe.py', '.github/workflows/repelis24-shop-access.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/repelis24_shop_access_probe.py
