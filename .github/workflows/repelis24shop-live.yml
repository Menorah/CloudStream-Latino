name: Verificación real RePelis24.shop
# Comprueba contra el sitio real el mismo flujo que ejecuta el complemento:
# catálogo, búsqueda, ficha de película, reproductores, serie, temporadas, episodios y manifiesto.
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'scripts/repelis24shop_live.py'
      - '.github/workflows/repelis24shop-live.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/repelis24shop_live.py
