name: Diagnóstico repelis24.shop
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'scripts/repelis24shop_probe.py'
      - '.github/workflows/repelis24shop-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/repelis24shop_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-output
          path: probe-output/
