name: Diagnóstico repelis24.shop
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'scripts/repelis24shop_probe.py'
      - '.github/workflows/repelis24shop-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        section: [home, cat, search, movie, serie, season, episode, extra]
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/repelis24shop_probe.py ${{ matrix.section }}
