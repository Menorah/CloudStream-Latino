name: Diagnóstico repelis24.shop (4)
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'scripts/repelis24shop_probe4.py'
      - '.github/workflows/repelis24shop-probe4.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        section: [nupload_decode, routes, home_headers, nupload_watch_headers]
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/repelis24shop_probe4.py ${{ matrix.section }}
