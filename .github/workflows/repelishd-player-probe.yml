name: Diagnóstico reproductor RePelisHD
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['scripts/repelishd_player_probe.py', '.github/workflows/repelishd-player-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/repelishd_player_probe.py
