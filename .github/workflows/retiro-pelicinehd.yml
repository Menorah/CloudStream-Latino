name: Republicar índice oficial (retiro de PeliCineHD)
# Flujo temporal: regenera plugins.json con los ocho complementos y lo sube a la
# release oficial "cloudstream" sin esperar a la próxima publicación de main.
on:
  push:
    branches: ['arena/**']
    paths: ['beta-trigger']
permissions:
  contents: write
concurrency:
  group: indice-oficial
  cancel-in-progress: false
jobs:
  indice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generar plugins.json
        run: ./gradlew make makePluginsJson --stacktrace
      - name: Subir el índice a la release oficial
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, pathlib
          plugins = json.loads(pathlib.Path('build/plugins.json').read_text())
          names = sorted(pathlib.Path(p['url']).name for p in plugins)
          print('índice oficial:', names)
          expected = {
              'AnimeOnlineNinja.cs3', 'VerAni.cs3', 'Repelis24CZ.cs3', 'CinecalidadAM.cs3',
              'CinecalidadMY.cs3', 'RePelisHD.cs3', 'PoseidonHD2.cs3', 'RePelis24Shop.cs3',
          }
          assert set(names) == expected, (names, sorted(expected))
          PY
          for attempt in 1 2 3 4 5; do
            if gh release upload cloudstream build/plugins.json --clobber; then
              echo "índice actualizado"
              break
            fi
            echo "reintento $attempt"
            sleep $((attempt * 15))
            if [ "$attempt" = 5 ]; then exit 1; fi
          done
          gh release view cloudstream --json assets --jq '.assets[].name'
