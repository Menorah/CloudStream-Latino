name: Inspeccionar sitios.7z (detalle HTML)

on:
  push:
    branches:
      - arena/5ed72362-cloudstream-latino
    paths:
      - '.github/workflows/sitios-inspect.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar, limpiar y extraer HTML clave de sitios.7z
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full python3-bs4 python3-lxml
          mkdir -p /tmp/sitios_work/extracted

          DL_URL="https://tmpfiles.org/dl/1795801727.b262f642402e84fc/wcA5vDSXwTLB/sitios.7z"
          if ! curl -fsSL -A "Mozilla/5.0" -o /tmp/sitios_work/sitios.7z "$DL_URL" || [ ! -s /tmp/sitios_work/sitios.7z ]; then
            PAGE_HTML=$(curl -fsSL -A "Mozilla/5.0" "https://tmpfiles.org/wcA5vDSXwTLB/sitios.7z")
            FOUND_URL=$(python3 -c 'import re,sys; h=sys.stdin.read(); m=re.search(r"https://tmpfiles\.org/dl/[^\x22\x27<> ]+sitios\.7z", h); print(m.group(0) if m else "")' <<< "$PAGE_HTML")
            curl -fsSL -A "Mozilla/5.0" -o /tmp/sitios_work/sitios.7z "$FOUND_URL"
          fi

          7z x -y /tmp/sitios_work/sitios.7z -o/tmp/sitios_work/extracted >/dev/null

          python3 - <<'PY'
          import os, json, re, base64, zlib, subprocess
          from bs4 import BeautifulSoup

          root = "/tmp/sitios_work/extracted"
          html_files = []
          for dirpath, _, filenames in os.walk(root):
              for fn in sorted(filenames):
                  full = os.path.join(dirpath, fn)
                  rel = os.path.relpath(full, root)
                  if rel.lower().endswith((".html", ".htm")):
                      html_files.append((rel, os.path.getsize(full), full))
          html_files.sort()

          def clean_html(raw):
              soup = BeautifulSoup(raw, "lxml")
              for tag in soup.find_all(["style", "noscript"]):
                  tag.decompose()
              for svg in soup.find_all("svg"):
                  # keep class/aria-label/width/height summary, strip heavy path markup
                  svg.clear()
              for sc in soup.find_all("script"):
                  txt = sc.string or ""
                  if any(bad in txt for bad in ("popundersPerIP", "atOptions", "adblock", "IntersectionObserver", "gtag(", "fbevents", "darkcss")):
                      sc.decompose()
              # strip data-darkreader inline attrs to shrink size drastically
              for el in soup.find_all(True):
                  for k in list(el.attrs.keys()):
                      if "darkreader" in k.lower():
                          del el.attrs[k]
              return str(soup)

          bundle = {}
          for rel, sz, full in html_files:
              with open(full, "r", encoding="utf-8", errors="replace") as f:
                  raw = f.read()
              cleaned = clean_html(raw)
              bundle[rel] = {"orig_bytes": sz, "html": cleaned}

          payload = json.dumps(bundle, ensure_ascii=False).encode("utf-8")
          comp = base64.b64encode(zlib.compress(payload, 9)).decode("ascii")
          print(f"Files: {len(bundle)}, raw cleaned JSON: {len(payload)}, compressed b64: {len(comp)}")

          sha = os.environ["GITHUB_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          chunk = 58000
          parts = [comp[i:i+chunk] for i in range(0, len(comp), chunk)]
          print("Comment parts:", len(parts))
          for i, part in enumerate(parts):
              body = f"<!-- SITIOS_HTML {i+1}/{len(parts)} -->\n```\n{part}\n```"
              subprocess.run(
                  ["gh", "api", f"repos/{repo}/commits/{sha}/comments", "-f", f"body={body}"],
                  check=True,
              )
          PY
