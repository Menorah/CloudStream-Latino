name: Diagnóstico de acceso SoloLatino
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['scripts/sololatino_access_probe.py', '.github/workflows/sololatino-access.yml']
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Comparar acceso de escritorio y Android
        run: |
          python3 scripts/sololatino_access_probe.py | tee /tmp/sololatino-access.txt
          python3 - <<'PY'
          from pathlib import Path
          report = Path('/tmp/sololatino-access.txt').read_text()
          print('::notice::' + report.replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D'))
          PY
