name: Diagnóstico familia Pelisplus/Cuevana
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['scripts/trap_family_probe.py', '.github/workflows/trap-family-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/trap_family_probe.py
