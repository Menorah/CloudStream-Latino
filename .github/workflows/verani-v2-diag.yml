name: Sonda VerAni.me v2

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

jobs:
  verani_v2_live_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run VerAniV2 tests with live network checks
        env:
          VERANI_LIVE: 'true'
        run: |
          set +e
          ./gradlew :VerAniV2:testDebugUnitTest --rerun-tasks --info > live-test-log.txt 2>&1
          status=$?
          python3 - <<'PY'
          import base64, json, pathlib, xml.etree.ElementTree as ET, zlib
          out = {'reports': [], 'live_lines': [], 'errors': []}
          for p in sorted(pathlib.Path('VerAniV2/build/test-results/testDebugUnitTest').glob('TEST-*.xml')):
              root = ET.parse(p).getroot()
              cases = []
              for c in root.findall('.//testcase'):
                  st = 'ok'
                  msg = ''
                  if c.find('skipped') is not None:
                      st = 'skipped'
                  for fe in c.findall('failure') + c.findall('error'):
                      st = 'fail'
                      msg = (fe.get('message') or fe.text or '')[:800]
                  sys_out = (c.findtext('system-out') or '')
                  for ln in sys_out.splitlines():
                      if any(k in ln for k in ('LIVE_', 'PROBE_STREAM:')):
                          out['live_lines'].append(ln)
                  cases.append({'name': c.get('name'), 'status': st, 'msg': msg})
              out['reports'].append({'suite': root.get('name'), 'tests': root.get('tests'), 'failures': root.get('failures'), 'errors': root.get('errors'), 'skipped': root.get('skipped'), 'cases': cases})
          log = pathlib.Path('live-test-log.txt').read_text(errors='replace')
          for ln in log.splitlines():
              if any(k in ln for k in ('LIVE_', 'PROBE_STREAM:', 'e: ', 'FAILED')):
                  if ln not in out['live_lines']:
                      out['live_lines'].append(ln[:300])
          if not out['reports']:
              out['errors'].append(log[-4000:])
          blob = base64.b64encode(zlib.compress(json.dumps(out, ensure_ascii=False).encode(), 9)).decode()
          step = 3400
          chunks = [blob[i:i+step] for i in range(0, len(blob), step)]
          for idx, ch in enumerate(chunks[:9]):
              print(f"::notice title=LIVE_{idx+1}_{len(chunks)}::{ch}")
          PY
          exit "$status"
