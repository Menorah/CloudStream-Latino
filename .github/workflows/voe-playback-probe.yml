name: Diagnóstico reproducción VOE
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['scripts/voe_playback_probe.py', '.github/workflows/voe-playback-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/voe_playback_probe.py
