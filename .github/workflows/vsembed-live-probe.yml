name: Sonda vsembed.su en vivo
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/vsembed-live-probe.yml']
permissions:
  contents: read
jobs:
  android_webview_media3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar Chrome real (Xvfb) en la misma IP del runner y validar /pl vs /pli
        run: |
          python3 -m pip install -q playwright
          python3 -m playwright install chromium || true
          xvfb-run -a python3 - <<'PY'
          import json, re, time, urllib.parse, urllib.request
          from playwright.sync_api import sync_playwright

          TARGETS = [
              ("BigGirls_1477963", "https://vsembed.su/embed/movie?tmdb=1477963&ds_lang=es&sub_url=https%3A%2F%2Fpelisjuanita.com%2Fvidsrc%2Fcorsproxy.php%3Furl%3Dhttps%253A%252F%252Fwww.subtitlecat.com%252Fsubs%252F1812%252FBig.Girls.Dont.Cry.2026.1080p.WEBRip.x264.AAC-%255BYTS.GG%2520-%2520YTS.BZ%255D-es-419.srt&sub_label=Espa%C3%B1ol&sub_lang=es&utm_source=pelisjuanita.com"),
              ("SkinCrawler_1843139", "https://vsembed.su/embed/movie?tmdb=1843139&ds_lang=es&sub_url=https%3A%2F%2Fpelisjuanita.com%2Fvidsrc%2Fcorsproxy.php%3Furl%3Dhttps%253A%252F%252Fwww.subtitlecat.com%252Fsubs%252F1812%252FThe.Skin.Crawler.Murders.2026.1080p.WEBRip.x264.AAC-%255BYTS.GG%2520-%2520YTS.BZ%255D-2-es.srt&sub_label=Espa%C3%B1ol&sub_lang=es"),
          ]

          captured = {}
          with sync_playwright() as p:
              try:
                  browser = p.chromium.launch(channel="chrome", headless=False, args=["--no-sandbox", "--disable-blink-features=AutomationControlled"])
              except Exception:
                  browser = p.chromium.launch(headless=False, args=["--no-sandbox", "--disable-blink-features=AutomationControlled"])
              ctx = browser.new_context(viewport={"width": 1280, "height": 720})
              for label, url in TARGETS:
                  page = ctx.new_page()
                  page.route("**/disable-devtool*", lambda route: route.abort())
                  events = []
                  found = {"stream": "", "headers": {}}
                  def on_req(req):
                      u = req.url
                      low = u.lower()
                      if any(k in low for k in ["vs_src.php", "/embed/movie/", "/embed/player/", "data.vidsrc.sh", ".wasm", "generate.php", "verify.php", "turnstile", "/pl/", "/pli/", "/plc/", "about:blank"]):
                          events.append(f"REQ:{u[:105]}")
                      if ("/pl/" in low or "/pli/" in low or "/plc/" in low) and "token=" in low and not found["stream"]:
                          found["stream"] = u
                          found["headers"] = dict(req.headers)
                  def on_resp(resp):
                      u = resp.url
                      if any(k in u for k in ["vs_src.php", "verify.php", "generate.php", "data.vidsrc.sh"]):
                          try:
                              events.append(f"RESP:{resp.status}:{u[:60]}:{resp.text()[:120]}")
                          except Exception:
                              events.append(f"RESP:{resp.status}:{u[:60]}")
                  page.on("request", on_req)
                  page.on("response", on_resp)
                  page.on("framenavigated", lambda fr: events.append(f"NAV:{fr.url[:80]}"))
                  page.goto(url, referer="https://pelisjuanita.com/", wait_until="domcontentloaded", timeout=25000)

                  for step in range(45):
                      if found["stream"]:
                          break
                      for fr in page.frames:
                          if "/embed/movie/" in fr.url and "/embed/player/" not in fr.url:
                              try:
                                  bp = fr.locator("#bigPlay")
                                  if bp.count() > 0 and bp.is_visible():
                                      bp.click()
                                      events.append("CLICKED_BIGPLAY")
                              except Exception:
                                  pass
                          if "challenges.cloudflare.com" in fr.url and step in (10, 18, 26):
                              try:
                                  el = fr.frame_element()
                                  box = el.bounding_box()
                                  events.append(f"TS_BOX:{box}")
                                  if box and box["width"] > 20 and box["height"] > 20:
                                      page.mouse.click(box["x"] + 28, box["y"] + box["height"] / 2)
                                      events.append("MOUSE_CLICKED_TS")
                              except Exception as ex:
                                  events.append(f"TS_ERR:{repr(ex)[:60]}")
                      time.sleep(0.8)

                  ts_info = {}
                  for fr in page.frames:
                      if "/embed/player/" in fr.url:
                          try:
                              ts_info = fr.evaluate("""() => {
                                  const h = document.documentElement.innerHTML;
                                  const i = h.indexOf('turnstile.render');
                                  return {
                                      hasApiToken: !!(window.CONFIG && window.CONFIG.apiToken),
                                      turnstile: !!(window.CONFIG && window.CONFIG.turnstile),
                                      gateClass: (document.getElementById('tsGate') || {}).className || '',
                                      gateText: ((document.getElementById('tsGate') || {}).innerText || '').slice(0, 100),
                                      tsSnippet: i > -1 ? h.slice(Math.max(0, i - 350), i + 700) : ''
                                  };
                              }""")
                          except Exception as e:
                              ts_info = {"eval_err": repr(e)}
                  res = {"label": label, "stream": found["stream"], "headers": found["headers"], "ts": ts_info, "events": events[-20:]}
                  if found["stream"]:
                      hdrs = {k: v for k, v in found["headers"].items() if k.lower() in ("origin", "referer", "user-agent")}
                      for mode in ["orig", "pli", "plc"]:
                          tu = found["stream"]
                          if mode != "orig":
                              tu = re.sub(r'/pl(i|c)?/', f'/{mode}/', tu, count=1)
                          try:
                              with urllib.request.urlopen(urllib.request.Request(tu, headers=hdrs), timeout=15) as r:
                                  body = r.read().decode("utf-8", "replace")
                                  lines = [ln.strip() for ln in body.splitlines() if ln.strip() and not ln.startswith("#")]
                                  res[f"{mode}_master"] = {"code": r.status, "has_tok": "token=" in body, "lines": len(lines), "first": lines[0][:120] if lines else body[:120]}
                                  if lines:
                                      cu = urllib.parse.urljoin(tu, lines[0])
                                      try:
                                          with urllib.request.urlopen(urllib.request.Request(cu, headers=hdrs), timeout=15) as rc:
                                              cb = rc.read().decode("utf-8", "replace")
                                              cl = [ln.strip() for ln in cb.splitlines() if ln.strip() and not ln.startswith("#")]
                                              res[f"{mode}_child"] = {"code": rc.status, "has_tok": "token=" in cb, "first_seg": cl[0][:120] if cl else cb[:120]}
                                      except urllib.error.HTTPError as ce:
                                          res[f"{mode}_child"] = {"code": ce.code}
                          except urllib.error.HTTPError as e:
                              res[f"{mode}_master"] = {"code": e.code}
                  captured[label] = res
                  s = json.dumps(res, ensure_ascii=False)[:3400].replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
                  print(f"::notice title=CHROME_{label}::{s}")
                  page.close()
              browser.close()
          open("/tmp/chrome_captured.json", "w").write(json.dumps(captured))
          PY

      - name: Preparar script de sonda en Android (API 28)
        run: |
          cat > /tmp/run_vsembed_probe.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          cat > PelisJuanita/src/main/kotlin/com/menorah/pelisjuanita/PlaybackProbe.kt <<'KT'
          package com.menorah.pelisjuanita

          import android.content.Context
          import android.graphics.SurfaceTexture
          import android.util.Log
          import android.view.Surface
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MimeTypes
          import androidx.media3.datasource.okhttp.OkHttpDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
          import com.lagradost.cloudstream3.USER_AGENT
          import com.lagradost.cloudstream3.app
          import kotlinx.coroutines.*
          import okhttp3.Request
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.File
          import java.io.InputStreamReader
          import java.net.InetAddress
          import java.net.ServerSocket
          import java.net.URI
          import java.net.URLDecoder

          object PlaybackProbe {
              private const val TAG = "VsembedProbe"

              fun start(context: Context) {
                  Log.i(TAG, "START_PROBE called")
                  CoroutineScope(SupervisorJob() + Dispatchers.Main).launch {
                      try {
                          delay(3000)
                          withTimeout(300_000) {
                              val seedFile = File("/sdcard/Cloudstream3/chrome_captured.json")
                              if (!seedFile.exists()) {
                                  Log.i(TAG, "NO_CHROME_CAPTURE_FILE")
                                  Log.i(TAG, "PASS_VSEMBED_PROBE")
                                  return@withTimeout
                              }
                              val j = JSONObject(seedFile.readText())
                              var anyStream = false
                              for (key in j.keys()) {
                                  val item = j.getJSONObject(key)
                                  val sUrl = item.optString("stream")
                                  if (sUrl.isBlank()) {
                                      Log.i(TAG, "NO_STREAM_FROM_CHROME $key")
                                      continue
                                  }
                                  anyStream = true
                                  val hdrObj = item.optJSONObject("headers")
                                  val origin = hdrObj?.optString("origin")?.ifBlank { null } ?: "https://stellarconductornexus.com"
                                  val ua = hdrObj?.optString("user-agent")?.ifBlank { null } ?: USER_AGENT
                                  val playHeaders = mapOf("Origin" to origin, "Referer" to "$origin/", "User-Agent" to ua)

                                  val plRes = runCatching { play(context, sUrl, playHeaders, waitMs = 1500) }
                                  Log.i(TAG, "SEED_MEDIA3 $key mode=orig_pl ok=${plRes.isSuccess} err=${plRes.exceptionOrNull()?.message}")

                                  val pliUrl = sUrl.replaceFirst("/pl/", "/pli/")
                                  val pliRes = runCatching { play(context, pliUrl, playHeaders, waitMs = 1500) }
                                  Log.i(TAG, "SEED_MEDIA3 $key mode=pli ok=${pliRes.isSuccess} err=${pliRes.exceptionOrNull()?.message}")

                                  val proxyRes = runCatching { playViaLocalProxy(context, sUrl, playHeaders) }
                                  Log.i(TAG, "SEED_MEDIA3 $key mode=local_proxy ok=${proxyRes.isSuccess} err=${proxyRes.exceptionOrNull()?.message}")

                                  if (key.startsWith("BigGirls") && (pliRes.isSuccess || proxyRes.isSuccess)) {
                                      val testUrl = if (pliRes.isSuccess) pliUrl else sUrl
                                      delay(65_000)
                                      val afterRes = withContext(Dispatchers.IO) {
                                          runCatching {
                                              val req = Request.Builder().url(testUrl)
                                                  .header("Origin", origin)
                                                  .header("Referer", "$origin/")
                                                  .header("User-Agent", ua)
                                                  .build()
                                              app.baseClient.newCall(req).execute().use { r ->
                                                  "code=${r.code} len=${r.body?.string()?.length ?: -1}"
                                              }
                                          }.getOrElse { it.message ?: "err" }
                                      }
                                      Log.i(TAG, "AFTER_65S $key -> $afterRes")
                                  }
                              }
                              Log.i(TAG, "PASS_VSEMBED_PROBE anyStream=$anyStream")
                          }
                      } catch (t: Throwable) {
                          Log.e(TAG, "FAIL_VSEMBED_PROBE ${t.javaClass.simpleName}: ${t.message}", t)
                      }
                  }
              }

              private suspend fun play(context: Context, url: String, headers: Map<String, String>, waitMs: Long) = withTimeout(35_000) {
                  val texture = SurfaceTexture(0)
                  val surface = Surface(texture)
                  val cleanHeaders = headers.toMutableMap()
                  val userAgent = cleanHeaders.entries.firstOrNull { it.key.equals("User-Agent", true) }?.value ?: USER_AGENT
                  cleanHeaders.keys.filter { it.equals("User-Agent", true) }.forEach { cleanHeaders.remove(it) }
                  val factory = OkHttpDataSource.Factory(app.baseClient)
                      .setUserAgent(userAgent)
                      .setDefaultRequestProperties(cleanHeaders)
                  val item = MediaItem.Builder().setUri(url).setMimeType(MimeTypes.APPLICATION_M3U8).build()
                  val media = DefaultMediaSourceFactory(factory).createMediaSource(item)
                  val player = ExoPlayer.Builder(context).build()
                  try {
                      player.setVideoSurface(surface)
                      player.setMediaSource(media)
                      player.prepare()
                      player.playWhenReady = true
                      while (true) {
                          player.playerError?.let { throw it }
                          if ((player.videoDecoderCounters?.renderedOutputBufferCount ?: 0) > 0 && player.currentPosition > waitMs) break
                          delay(250)
                      }
                      check(player.videoSize.width > 0 && player.videoSize.height > 0) { "no decoded video" }
                  } finally {
                      player.release()
                      surface.release()
                      texture.release()
                  }
              }

              private suspend fun playViaLocalProxy(context: Context, rawPlUrl: String, headers: Map<String, String>) {
                  val token = URI(rawPlUrl).rawQuery.orEmpty().split("&")
                      .firstOrNull { it.startsWith("token=") }?.substringAfter("token=").orEmpty()
                  check(token.isNotBlank()) { "missing token in rawPlUrl" }
                  val origin = headers["Origin"] ?: "https://stellarconductornexus.com"
                  val referer = headers["Referer"] ?: "$origin/"
                  val ua = headers["User-Agent"] ?: USER_AGENT

                  val server = withContext(Dispatchers.IO) { ServerSocket(0, 8, InetAddress.getByName("127.0.0.1")) }
                  val port = server.localPort
                  val proxyJob = CoroutineScope(Dispatchers.IO).launch {
                      while (isActive && !server.isClosed) {
                          val sock = runCatching { server.accept() }.getOrNull() ?: break
                          launch {
                              sock.use { s ->
                                  val reader = BufferedReader(InputStreamReader(s.getInputStream()))
                                  val reqLine = reader.readLine() ?: return@use
                                  while (true) {
                                      val ln = reader.readLine() ?: break
                                      if (ln.isEmpty()) break
                                  }
                                  val path = reqLine.split(" ").getOrNull(1) ?: "/master.m3u8"
                                  val upstreamUrl = if (path.startsWith("/fetch?u=")) {
                                      URLDecoder.decode(path.substringAfter("/fetch?u="), "UTF-8")
                                  } else {
                                      rawPlUrl
                                  }
                                  val req = Request.Builder().url(upstreamUrl)
                                      .header("Origin", origin)
                                      .header("Referer", referer)
                                      .header("User-Agent", ua)
                                      .build()
                                  val bodyText = app.baseClient.newCall(req).execute().use { r ->
                                      if (!r.isSuccessful) error("upstream ${r.code} for $upstreamUrl")
                                      r.body?.string().orEmpty()
                                  }
                                  val baseUri = URI(upstreamUrl)
                                  val isMaster = bodyText.contains("#EXT-X-STREAM-INF")
                                  val outText = bodyText.lines().joinToString("\n") { line ->
                                      val tr = line.trim()
                                      if (tr.isEmpty() || tr.startsWith("#")) {
                                          line
                                      } else {
                                          val abs = baseUri.resolve(tr).toString()
                                          val sep = if (abs.contains("?")) "&" else "?"
                                          val stamped = if (abs.contains("token=")) abs else "${abs}${sep}token=$token"
                                          if (isMaster) {
                                              "http://127.0.0.1:$port/fetch?u=" + java.net.URLEncoder.encode(stamped, "UTF-8")
                                          } else {
                                              stamped
                                          }
                                      }
                                  }
                                  val bytes = outText.toByteArray(Charsets.UTF_8)
                                  val resp = "HTTP/1.1 200 OK\r\nContent-Type: application/vnd.apple.mpegurl\r\nContent-Length: ${bytes.size}\r\nConnection: close\r\n\r\n"
                                  s.getOutputStream().write(resp.toByteArray(Charsets.US_ASCII))
                                  s.getOutputStream().write(bytes)
                                  s.getOutputStream().flush()
                              }
                          }
                      }
                  }
                  try {
                      play(context, "http://127.0.0.1:$port/master.m3u8", headers, waitMs = 1500)
                  } finally {
                      proxyJob.cancel()
                      runCatching { server.close() }
                  }
              }
          }
          KT

          python3 - <<'PY'
          p = 'PelisJuanita/src/main/kotlin/com/menorah/pelisjuanita/PelisJuanitaPlugin.kt'
          s = open(p).read().replace(
              'registerExtractorAPI(PelisJuanitaVidHideExtractor())',
              'registerExtractorAPI(PelisJuanitaVidHideExtractor()); PlaybackProbe.start(context)',
          )
          assert 'PlaybackProbe.start(context)' in s
          open(p, 'w').write(s)

          p = 'PelisJuanita/build.gradle.kts'
          s = open(p).read().replace(
              'dependencies {',
              'dependencies {\n    compileOnly("androidx.media3:media3-exoplayer:1.9.3")\n    compileOnly("androidx.media3:media3-exoplayer-hls:1.9.3")\n    compileOnly("androidx.media3:media3-datasource-okhttp:1.9.3")',
              1,
          )
          open(p, 'w').write(s)
          PY

          ./gradlew :PelisJuanita:make --stacktrace
          curl -fL --retry 3 https://github.com/recloudstream/cloudstream/releases/download/pre-release/app-prerelease-release.apk -o /tmp/cloudstream.apk
          adb install -r /tmp/cloudstream.apk
          package=com.lagradost.cloudstream3.prerelease
          adb shell pm grant "$package" android.permission.READ_EXTERNAL_STORAGE
          adb shell pm grant "$package" android.permission.WRITE_EXTERNAL_STORAGE
          adb shell mkdir -p /sdcard/Cloudstream3/plugins
          if [ -f /tmp/chrome_captured.json ]; then
            adb push /tmp/chrome_captured.json /sdcard/Cloudstream3/chrome_captured.json
          fi
          adb push PelisJuanita/build/PelisJuanita.cs3 /sdcard/Cloudstream3/plugins/PelisJuanita.cs3
          adb logcat -c
          adb shell monkey -p "$package" 1
          for i in $(seq 1 65); do
            sleep 5
            log=$(adb logcat -d -s VsembedProbe:* '*:S')
            if echo "$log" | grep -q 'PASS_VSEMBED_PROBE\|FAIL_VSEMBED_PROBE'; then
              echo "$log" | head -n 35 | while IFS= read -r ln; do
                clean=$(printf '%s' "$ln" | sed 's/%/%25/g; s/\r//g')
                echo "::notice title=VSEMBED_LOG::$clean"
              done
              if echo "$log" | grep -q 'FAIL_VSEMBED_PROBE'; then exit 1; fi
              exit 0
            fi
          done
          adb logcat -d -s VsembedProbe:* AndroidRuntime:E PluginManager:* '*:S' | tail -40 | while IFS= read -r ln; do
            clean=$(printf '%s' "$ln" | sed 's/%/%25/g; s/\r//g')
            echo "::notice title=VSEMBED_TIMEOUT::$clean"
          done
          exit 1
          SH
          chmod +x /tmp/run_vsembed_probe.sh
      - name: Probar Media3 en CloudStream APK (API 28)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: /tmp/run_vsembed_probe.sh
